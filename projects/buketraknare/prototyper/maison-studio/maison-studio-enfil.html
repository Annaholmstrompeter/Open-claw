<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F1E8">
<title>Buketträknaren · Maison Studio (prototyp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@400..600&display=swap">
<style>
/* Buketträknaren, designriktning MAISON STUDIO (prototyp).
 * Ljust, varmt och återhållsamt. Bodoni Moda bara för buketens namn och för priser, Jost för allt annat. Hårfina linjer i stället för kort.
 *
 * LAYOUTREGEL: ingenting är position:fixed eller sticky. Appen är en kolumn med höjden 100 %: rubrikfält, innehåll och prisfält är vanliga
 * barn i den kolumnen, och bara innehållet rullar. Därför kan ett fält aldrig hamna ovanpå innehåll, oavsett skärmhöjd, tangentbord eller
 * textstorlek. All text får bryta rad. Inga fasta höjder på text, inga fält som kapar, ingen rullning i sidled. */
:root{
  --paper:#F5F1E8; --paper-2:#FBF8F2; --paper-3:#EEE8DA;
  --ink:#1E1B16; --ink-2:#4A433A; --mut:#675E50;
  --rule:#DDD3C1; --rule-2:#C4B8A0; --field:#8C7F68;
  --bronze:#7A5826; --claret:#7A2E3E; --ok:#2E5C47; --warn:#8A5410;
  --serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,'Times New Roman',serif;
  --sans:'Jost','Avenir Next','Segoe UI',Arial,sans-serif;
  --pad:16px;
}
@media (min-width:640px){:root{--pad:24px}}
*{box-sizing:border-box;margin:0}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
ul{list-style:none;padding:0}
svg.i{display:block;flex:none}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-80px;z-index:100;background:var(--ink);color:var(--paper);padding:12px 16px;font-weight:600}.skip:focus{top:8px}
.eyebrow{font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.num{font-variant-numeric:lining-nums tabular-nums}
.mk{font-family:var(--sans);font-weight:600;font-size:max(.55em,13px);line-height:1;vertical-align:.4em;margin-right:.25em}
.pr .mk,.jobline .mk,.l2 .mk,.menu .mk{font-size:1em;vertical-align:baseline}
.mk.ok{color:var(--ok)}.mk.ap{color:var(--warn)}
.link{display:inline-flex;align-items:center;gap:6px;min-height:44px;min-width:44px;font:600 14px/1.25 var(--sans);color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;text-align:left}
.link:hover{color:var(--bronze)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:6px 20px;background:var(--ink);color:var(--paper);font:600 15px/1.25 var(--sans);letter-spacing:.02em;text-align:center}
.btn:hover:not(:disabled){background:#38332A}
.btn:disabled{opacity:.38}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.btn--ghost:hover:not(:disabled){background:var(--paper-3)}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:16px var(--pad) 28px}

/* ---------- skal ---------- */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:0 10px;padding:0 var(--pad);background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:12px;min-height:48px;min-width:48px;justify-content:center;color:var(--ink);text-decoration:none}
.mono{width:32px;height:32px;flex:none;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:600 14px/1 var(--sans)}
.brand-t{display:none;font:600 13px/1.2 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.nav{flex:1 1 200px;min-width:0;display:flex;flex-wrap:wrap}
.nav button{position:relative;flex:1 1 auto;min-height:48px;padding:0 8px;text-align:center;font:600 13px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.nav button:hover{color:var(--ink)}
.nav [aria-current]{color:var(--ink)}
.nav [aria-current]::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--bronze)}
.proto{display:none;font:600 12px/1.2 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.screen{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.toast-slot{flex:none}
.toast{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;padding:6px var(--pad);background:var(--ink);color:var(--paper);font:500 14px/1.35 var(--sans)}
.toast span{flex:1 1 auto;min-width:0;padding:8px 0}
.toast button{flex:none;min-height:44px;padding:0 6px;font:600 14px/1 var(--sans);color:#E0C592;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}

/* ---------- gemensamma delar ---------- */
.compo{display:flex;gap:2px;height:8px}
.compo i{display:block;min-width:3px;box-shadow:inset 0 0 0 1px rgba(30,27,22,.2)}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:8px;font:400 14px/1.4 var(--sans);color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:block;width:10px;height:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(30,27,22,.25)}
.legend b{font-weight:600;color:var(--ink)}
.stp{display:inline-grid;grid-template-columns:44px minmax(36px,auto) 44px;align-items:center;text-align:center;box-shadow:inset 0 0 0 1px var(--rule-2);background:var(--paper-2)}
.stp button{min-height:44px;display:grid;place-items:center}
.stp button:hover:not(:disabled){background:var(--paper-3)}
.stp button:disabled{opacity:.35}
.stp output{font:600 17px/1 var(--sans);font-variant-numeric:lining-nums tabular-nums;padding:0 4px}
.sw{display:inline-block;width:12px;height:12px;flex:none;box-shadow:inset 0 0 0 1px rgba(30,27,22,.28)}
.tag{font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* ---------- HEM ---------- */
.home-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.home-head .btn{flex:1 1 220px;min-height:52px}
.sec{margin:26px 0 8px;font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.jobs{border-top:1px solid var(--ink)}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;width:100%;padding:14px 0 13px;border-bottom:1px solid var(--rule);align-items:start}
.job:hover{background:var(--paper-2)}
.job .nm{font:600 16px/1.3 var(--sans);overflow-wrap:anywhere}
.job .meta{grid-column:1;font:400 14px/1.4 var(--sans);color:var(--ink-2);overflow-wrap:anywhere}
.job .price{grid-column:2;grid-row:1 / span 2;text-align:right;font:500 22px/1.1 var(--serif);white-space:nowrap;font-variant-numeric:lining-nums}
.job .price small{display:block;margin-top:5px;font:600 12px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.job .compo{grid-column:1 / -1;margin-top:8px}
.note{margin-top:22px;font:400 14px/1.5 var(--sans);color:var(--ink-2);max-width:62ch}
.note .warn{color:var(--warn);font-weight:600}

/* ---------- BUKETTBYGGAREN: skal ---------- */
.bld{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panes{flex:1 1 auto;min-height:0;display:flex}
.pane{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column}
.pane-job{display:none}
.bld[data-mode="valj"] .pane-bq,.bld[data-mode="bukett"] .pane-pk{display:none}
.bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px var(--pad);background:var(--paper);border-top:1px solid var(--ink)}
.bar-p{flex:1 1 140px}
.bar-who{font:600 13px/1.3 var(--sans);color:var(--ink-2);overflow-wrap:anywhere}
.bar-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px}
.bar-price b{font:500 28px/1.15 var(--serif);font-variant-numeric:lining-nums;white-space:nowrap}
.bar-price span{font:400 14px/1.3 var(--sans);color:var(--ink-2)}
.bar-sub{font:400 13px/1.35 var(--sans);color:var(--ink-2)}
.bar-go{flex:1 1 190px}
.ik-bar .bar-go{flex:0 1 260px;margin-left:auto}
.bar-links{display:none}

/* ---------- blomvalet ---------- */
.pk-top{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px var(--pad) 8px}
.search{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 2px 0 12px;background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--field)}
.search:focus-within{outline:3px solid var(--bronze);outline-offset:2px}
.search input{flex:1 1 auto;min-width:0;min-height:44px;border:0;background:transparent;font:500 16px/1.25 var(--sans);outline:0;padding:0;border-radius:0;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search input::placeholder{color:#6F6556;opacity:1}
.search .clr{flex:none;width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink-2)}
.search .clr[hidden]{display:none}
.search .i{color:var(--ink-2)}
.selbtn{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;width:100%;min-height:48px;padding:6px 12px;box-shadow:inset 0 0 0 1px var(--ink);background:var(--paper)}
.selbtn:disabled{box-shadow:inset 0 0 0 1px var(--rule-2);color:var(--ink-2)}
.selbtn .l{flex:none;font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.selbtn .v{flex:1 1 auto;min-width:0;font:600 16px/1.25 var(--sans);overflow-wrap:anywhere}
.selbtn .v .hrt{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--claret)}
.selbtn .n{flex:none;font:500 14px/1.2 var(--sans);color:var(--mut)}
.selbtn .i{transition:transform .15s;color:var(--ink-2)}
.selbtn[aria-expanded="true"] .i{transform:rotate(180deg)}
.chips{display:none;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;box-shadow:inset 0 0 0 1px var(--rule-2);font:600 14px/1.2 var(--sans);text-align:center}
.chip .n{font-weight:500;color:var(--mut)}
.chip:hover{background:var(--paper-3)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.chip[aria-pressed="true"] .n{color:#DDD6C7}
.chip .hrt{display:inline-flex;color:var(--claret)}
.chip[aria-pressed="true"] .hrt{color:#E9B8C2}
.pk-scroll{padding:0 var(--pad) 16px}
.tiles{display:grid;grid-template-columns:1fr;border-top:1px solid var(--ink)}
.tile{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tile:hover{background:var(--paper-2)}
.tile .nm{font:600 16px/1.25 var(--sans);overflow-wrap:anywhere}
.tile .nm .hrt{display:inline-flex;vertical-align:-3px;margin-right:6px;color:var(--claret)}
.tile .ct{flex:none;font:500 14px/1.2 var(--sans);color:var(--mut)}
.tile[aria-current="true"]{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--bronze);padding-left:12px}
@media (min-width:360px){.tiles{grid-template-columns:1fr 1fr;column-gap:16px}}
.pk-list{margin:0 calc(var(--pad) * -1)}
.pk-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 46px;padding-left:var(--pad);background-image:linear-gradient(var(--rule),var(--rule));background-repeat:no-repeat;background-size:calc(100% - var(--pad) * 2) 1px;background-position:var(--pad) 100%}
.pk-row.on{background-color:var(--paper-2)}
.pk-row.on::before{content:'';position:absolute;left:0;top:0;bottom:1px;width:3px;background:var(--bronze)}
.pk-pick{display:flex;align-items:center;gap:12px;min-width:0;min-height:50px;padding:5px 0}
.pk-chk{flex:none;display:grid;place-items:center;width:24px;height:24px;background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--field);color:var(--paper)}
.pk-row.on .pk-chk{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pk-txt{display:block;min-width:0;flex:1 1 auto}
.pk-l1{display:flex;align-items:baseline;gap:0 8px;flex-wrap:wrap;font:600 16px/1.3 var(--sans)}
.pk-l1 .sw{align-self:center}
.pk-nm{overflow-wrap:anywhere}
.pk-nm mark{background:#EBDDB8;color:var(--ink);padding:0 1px}
.pk-old{margin-left:auto;font:600 13px/1.3 var(--sans);color:var(--warn)}
.pk-stems{margin-left:auto;font:600 13px/1.3 var(--sans);color:var(--bronze)}
.pk-crumb{margin-left:auto;font:600 12px/1.3 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.pk-old + .pk-stems,.pk-old + .pk-crumb,.pk-stems + .pk-crumb{margin-left:10px}
.pk-l2{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 7px;padding-left:20px}
.pk-l2 .u{font:600 15px/1.3 var(--sans);color:var(--ink)}
.pk-l2 .d{font:400 14px/1.3 var(--sans);color:var(--ink-2)}
.pk-fav{display:grid;place-items:center;width:46px;min-height:50px;color:var(--mut)}
.pk-fav[aria-pressed="true"]{color:var(--claret)}
.pk-grp{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px var(--pad) 6px;font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.pk-grp .n{font-weight:500;letter-spacing:0}
.pk-list .pk-grp:first-child{padding-top:8px}
.pk-note{margin:14px 0 4px;max-width:62ch;font:400 13px/1.45 var(--sans);color:var(--ink-2)}
.pk-empty{padding:14px 0 10px;font:400 15px/1.5 var(--sans);color:var(--ink-2);max-width:54ch}
.pk-empty svg{display:inline-block;vertical-align:-4px;color:var(--claret)}
.pk-more{margin-top:6px}
.about{margin:10px 0 4px;padding:14px 0 12px;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);max-width:66ch}
.about h2{font:600 16px/1.3 var(--sans);margin-bottom:8px}
.about ul{display:grid;gap:8px}
.about li{font:400 14px/1.5 var(--sans);color:var(--ink-2)}
.about li b{font-weight:600;color:var(--ink)}
.about .h{margin-top:14px;font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.about .demo{display:flex;flex-wrap:wrap;align-items:center;gap:0 14px;margin-top:4px}
.about .lbl{font:400 14px/1.3 var(--sans);color:var(--ink-2)}
.seg{display:inline-flex;flex-wrap:wrap;box-shadow:inset 0 0 0 1px var(--ink)}
.seg button{min-height:44px;min-width:64px;padding:0 16px;font:600 14px/1.2 var(--sans);text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.about pre{margin-top:6px;padding:10px 12px;background:var(--paper-3);color:var(--ink);font:400 13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- min bukett ---------- */
.bq{padding:16px var(--pad) 24px}
.bq-job{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.bq-job .eyebrow{overflow-wrap:anywhere}
.bq-t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:4px}
.bq-title{flex:1 1 auto;min-width:0;padding-top:2px;font:400 28px/1.12 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.icon-btn{flex:none;width:44px;min-height:44px;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{color:var(--bronze)}
.compo-line{margin-top:10px}
.bq-act{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px}
.renameform{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.renameform input{flex:1 1 100%;min-width:0;min-height:48px;padding:0 12px;border:0;box-shadow:inset 0 0 0 1px var(--field);background:var(--paper-2);font:500 16px/1.25 var(--sans);border-radius:0}
.renameform .btn{min-height:48px}
.jobline{margin-top:14px;font:400 14px/1.45 var(--sans);color:var(--ink-2)}
.link--inline{min-height:44px}
.jobline b{font-weight:600;color:var(--ink)}
.count .t{font:400 14px/1.35 var(--sans);color:var(--ink-2)}
.count .t b{font-weight:600;color:var(--ink)}
.compo-block{margin-top:14px}
.compo-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;margin-bottom:8px;font:400 14px/1.35 var(--sans);color:var(--ink-2)}
.bq-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin-top:18px;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.bq-h h2{font:600 12px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.bq-h span{font:400 13px/1.3 var(--sans);color:var(--ink-2)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.row.fresh{animation:fresh 2.4s ease-out}
@keyframes fresh{0%,45%{background-color:#EBDDB8}100%{background-color:transparent}}
.row .nm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font:600 16px/1.3 var(--sans);overflow-wrap:anywhere}
.row .l2{grid-column:1;font:400 14px/1.4 var(--sans);color:var(--ink-2);overflow-wrap:anywhere}
.row .l2 .u{font-weight:600;color:var(--ink)}
.row .buy{grid-column:1;font:500 14px/1.4 var(--sans);color:var(--bronze);overflow-wrap:anywhere}
.row .warn{color:var(--warn);font-weight:600}
.row .stp,.row .amt{grid-column:2;grid-row:1 / span 4;align-self:center}
.row--add{display:block;padding:6px 0}
.amt{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;box-shadow:inset 0 0 0 1px var(--field);background:var(--paper-2)}
.amt input{width:72px;min-height:44px;border:0;background:transparent;text-align:right;font:600 17px/1 var(--sans);font-variant-numeric:lining-nums tabular-nums;padding:0;outline:0;border-radius:0}
.amt:focus-within{outline:3px solid var(--bronze);outline-offset:2px}
.amt span{font:500 14px/1 var(--sans);color:var(--ink-2)}
.addrow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;font:600 15px/1.3 var(--sans)}
.addrow small{display:block;font:400 14px/1.3 var(--sans);color:var(--ink-2)}
.ownform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:6px 0 14px}
.ownform label{display:grid;gap:5px;min-width:0;font:600 12px/1.2 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.ownform label:first-child{flex:1 1 100%}
.ownform label:nth-child(2){flex:1 1 9em}
.ownform .btn{flex:none}
.ownform input{min-height:48px;min-width:0;padding:0 12px;border:0;box-shadow:inset 0 0 0 1px var(--field);background:var(--paper-2);font:500 16px/1.25 var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);border-radius:0}
.empty-bq{padding:18px 0 8px;font:400 15px/1.5 var(--sans);color:var(--ink-2)}
.empty-bq .btn{margin-top:12px}
.receipt-t{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;margin-top:6px;font:600 14px/1.3 var(--sans);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.receipt-t .i{transition:transform .15s}
.receipt-t[aria-expanded="true"] .i{transform:rotate(180deg)}
.rcp-wrap{padding:6px 0 4px}
.rcp{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:0 12px;padding:6px 0;font:400 15px/1.35 var(--sans);border-bottom:1px dotted #9C917C}
.rcp .a{font-variant-numeric:lining-nums tabular-nums}
.rcp.sum{font-weight:600}
.rcp.total{margin-top:6px;padding-top:12px;border-top:1px solid var(--ink);border-bottom:0;font:500 22px/1.2 var(--serif)}
.danger{display:inline-flex;align-items:center;min-height:44px;font:600 14px/1.25 var(--sans);color:var(--claret);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.confirm{display:flex;align-items:center;flex-wrap:wrap;gap:0 16px;font:500 15px/1.35 var(--sans)}
.foot{margin-top:18px}
/* val av arrangemang (mobil): ligger i flödet och skjuter innehållet nedåt */
.menu{border-top:1px solid var(--ink);margin-top:2px}
.menu button{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:6px 4px;border-bottom:1px solid var(--rule)}
.menu button:hover{background:var(--paper-2)}
.menu button[aria-current="true"]{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--bronze);padding-left:12px}
.menu .nm{font:600 15px/1.3 var(--sans);overflow-wrap:anywhere}
.menu .pr{flex:none;font:400 14px/1.3 var(--sans);color:var(--ink-2);text-align:right}
.menu .add{font-weight:600;color:var(--ink-2)}
.arrsel{margin-top:12px}

/* ---------- jobbpanel (bred skärm) ---------- */
.jobp{padding:18px var(--pad) 20px}
.jobp h2{margin-top:8px;font:400 24px/1.15 var(--serif);letter-spacing:-.01em;overflow-wrap:anywhere}
.jobp .muted{margin-top:6px;font:400 14px/1.4 var(--sans);color:var(--ink-2)}
.arrs{margin-top:16px;border-top:1px solid var(--ink)}
.arrs button{display:block;width:100%;padding:11px 4px 11px 12px;border-bottom:1px solid var(--rule)}
.arrs button:hover{background:var(--paper-2)}
.arrs button[aria-current="true"]{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--bronze)}
.arrs .nm{display:block;font:600 15px/1.3 var(--sans);overflow-wrap:anywhere}
.arrs .pr{display:block;margin-top:2px;font:400 14px/1.35 var(--sans);color:var(--ink-2)}
.arrs .add{display:flex;align-items:center;gap:8px;min-height:48px;font-weight:600;color:var(--ink-2);overflow-wrap:anywhere}
.jobtotal{margin-top:20px}
.jobtotal .price{margin-top:6px;overflow-wrap:anywhere;font:500 30px/1.1 var(--serif);font-variant-numeric:lining-nums}
.jobtotal p{margin-top:6px;font:400 14px/1.4 var(--sans);color:var(--ink-2)}

/* ---------- INKÖP ---------- */
.ik-t{margin-top:14px;font:400 28px/1.12 var(--serif);letter-spacing:-.01em}
.ik-lede{margin-top:12px;font:400 14px/1.5 var(--sans);color:var(--ink-2);max-width:56ch}
.ik{margin-top:12px;border-top:1px solid var(--ink)}
.ik-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--rule);align-items:start}
.ik-row .nm{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font:600 16px/1.3 var(--sans);overflow-wrap:anywhere}
.ik-row .sub{grid-column:1;font:400 14px/1.4 var(--sans);color:var(--ink-2);overflow-wrap:anywhere}
.ik-row .sub .u{font-weight:600;color:var(--ink)}
.ik-num{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:2px 16px;font:400 14px/1.4 var(--sans);color:var(--ink-2)}
.ik-num b{font-weight:600;color:var(--ink)}
.ik-num .over{color:var(--mut)}
.ik-num .warn{color:var(--warn);font-weight:600}
.ik-cost{grid-column:2;grid-row:1;font:500 22px/1.15 var(--serif);white-space:nowrap;text-align:right;font-variant-numeric:lining-nums}
.ik-note{margin-top:12px;max-width:62ch;font:400 14px/1.5 var(--sans);color:var(--ink-2)}

<script>
/* Buketträknaren: pengar som exakta tal.
 *
 * Ny ekonomikod använder ALDRIG flyttal. Här finns två saker:
 *   Frac   ett exakt bråk av heltal (BigInt). Mellanräkningar sker alltid som Frac, så 186 ÷ 12 eller 100 ÷ 3 tappar inget.
 *   Money  ett belopp i hela ören (BigInt) och en valutakod. Det är det som sparas och visas.
 * Avrundning sker bara när koden uttryckligen ber om det (roundInt, roundToStep, Money.fromFrac), med ett namngivet läge:
 *   FLOOR    nedåt (mot minus oändlighet)
 *   CEIL     uppåt (mot plus oändlighet)
 *   HALF_UP  närmaste heltal, exakt hälften bort från noll
 * Procentsatser lagras som heltal i hundradels procent ("bp"): 25 % = 2500, 120 % = 12000.
 *
 * Valutans minsta enhet är alltid 1/100 här (SEK och EUR). Omräkning mellan valutor finns inte och byggs inte nu.
 *
 * Laddas som <script> i appen (window.BRMoney) och som modul i Node (tester och server).
 * En test kontrollerar att filen inte innehåller flyttalsanrop (Math., parseFloat, toFixed, Number(, decimaltal i kod).
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.BRMoney = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ROUNDING = Object.freeze({ FLOOR: 'FLOOR', CEIL: 'CEIL', HALF_UP: 'HALF_UP' });
  const CURRENCY_RE = /^[A-Z]{3}$/;
  const MINOR_PER_MAJOR = 100n;
  const MAX_EXPONENT = 30;

  class EconomyError extends Error {
    constructor(code, message, details) {
      super(message || code);
      this.name = 'EconomyError';
      this.code = code;
      if (details !== undefined) this.details = details;
    }
  }

  // ---------- heltalshjälpare (BigInt) ----------
  function toBig(x, what) {
    if (typeof x === 'bigint') return x;
    if (typeof x === 'number') {
      if (!Number.isSafeInteger(x)) throw new EconomyError('not_integer', (what || 'värdet') + ' måste vara ett heltal, fick ' + String(x));
      return BigInt(x);
    }
    if (typeof x === 'string' && /^-?\d+$/.test(x)) return BigInt(x);
    throw new EconomyError('not_integer', (what || 'värdet') + ' måste vara ett heltal');
  }
  const babs = x => (x < 0n ? -x : x);
  function gcd(a, b) { a = babs(a); b = babs(b); while (b !== 0n) { const t = a % b; a = b; b = t; } return a; }
  /** Golvdivision för positiv nämnare (BigInt-divisionen trunkerar mot noll). */
  function floorDiv(a, b) { let q = a / b; if (a % b < 0n) q -= 1n; return q; }
  /** BigInt till vanligt heltal (för små värden som procentsatser). Går via text, aldrig via flyttal. */
  function toSafeInt(x) {
    const n = parseInt(x.toString(), 10);
    if (!Number.isSafeInteger(n)) throw new EconomyError('overflow', 'heltalet är för stort');
    return n;
  }

  // ---------- Frac: exakt bråk ----------
  class Frac {
    constructor(n, d) { this.n = n; this.d = d; Object.freeze(this); }
    static of(n, d) {
      n = toBig(n, 'täljare'); d = d === undefined ? 1n : toBig(d, 'nämnare');
      if (d === 0n) throw new EconomyError('division_by_zero', 'division med noll');
      if (d < 0n) { n = -n; d = -d; }
      const g = gcd(n, d);
      return new Frac(n / g, d / g);
    }
    static from(x) {
      if (x instanceof Frac) return x;
      if (x instanceof Money) return x.toFrac();
      return Frac.of(x);
    }
    static sum(list) { let s = Frac.of(0n); for (const x of list) s = s.add(Frac.from(x)); return s; }
    add(o) { o = Frac.from(o); return Frac.of(this.n * o.d + o.n * this.d, this.d * o.d); }
    sub(o) { o = Frac.from(o); return Frac.of(this.n * o.d - o.n * this.d, this.d * o.d); }
    mul(o) { o = Frac.from(o); return Frac.of(this.n * o.n, this.d * o.d); }
    div(o) { o = Frac.from(o); if (o.n === 0n) throw new EconomyError('division_by_zero', 'division med noll'); return Frac.of(this.n * o.d, this.d * o.n); }
    neg() { return new Frac(-this.n, this.d); }
    abs() { return new Frac(babs(this.n), this.d); }
    cmp(o) { o = Frac.from(o); const l = this.n * o.d, r = o.n * this.d; return l < r ? -1 : l > r ? 1 : 0; }
    eq(o) { return this.cmp(o) === 0; }
    lt(o) { return this.cmp(o) < 0; }
    lte(o) { return this.cmp(o) <= 0; }
    gt(o) { return this.cmp(o) > 0; }
    gte(o) { return this.cmp(o) >= 0; }
    isZero() { return this.n === 0n; }
    isNegative() { return this.n < 0n; }
    isInteger() { return this.d === 1n; }
    sign() { return this.n < 0n ? -1 : this.n > 0n ? 1 : 0; }
    floor() { return floorDiv(this.n, this.d); }
    ceil() { return -floorDiv(-this.n, this.d); }
    toString() { return this.d === 1n ? this.n.toString() : this.n + '/' + this.d; }
    toJSON() { return { n: this.n.toString(), d: this.d.toString() }; }
    static fromJSON(o) { return Frac.of(toBig(o.n, 'n'), toBig(o.d, 'd')); }
  }

  /** Avrundar ett bråk till heltal med ett namngivet läge. */
  function roundInt(frac, mode) {
    const f = Frac.from(frac);
    switch (mode) {
      case ROUNDING.FLOOR: return f.floor();
      case ROUNDING.CEIL: return f.ceil();
      case ROUNDING.HALF_UP: {
        // närmaste heltal, hälften bort från noll
        const a = f.abs();
        const r = floorDiv(2n * a.n + a.d, 2n * a.d);
        return f.n < 0n ? -r : r;
      }
      default: throw new EconomyError('unknown_rounding', 'okänt avrundningsläge: ' + String(mode));
    }
  }

  /** Avrundar till en multipel av steget (båda i samma enhet). Steget måste vara positivt. */
  function roundToStep(frac, step, mode) {
    const s = Frac.from(step);
    if (!s.gt(0n)) throw new EconomyError('bad_step', 'avrundningssteget måste vara större än noll');
    return Frac.from(roundInt(Frac.from(frac).div(s), mode)).mul(s);
  }

  // ---------- decimaltal i text ----------
  /** Tolkar "186", "186,50", "-0.5", "1 234,5", "1e3" som exakt bråk. Tal tolkas via sin text, aldrig via flyttalsaritmetik. */
  function parseDecimal(input) {
    let s = typeof input === 'number' ? String(input) : input;
    if (typeof s !== 'string') throw new EconomyError('bad_decimal', 'ett tal eller en text väntades');
    s = s.replace(/[\s ]/g, '');
    const m = /^([+-])?(\d*)(?:[.,](\d*))?(?:[eE]([+-]?\d+))?$/.exec(s);
    if (!m || (m[2] === '' && (m[3] === undefined || m[3] === ''))) throw new EconomyError('bad_decimal', 'inte ett tal: ' + JSON.stringify(input));
    const intPart = m[2] || '', frac = m[3] || '';
    let exp = m[4] === undefined ? 0 : parseInt(m[4], 10);
    if (!Number.isSafeInteger(exp) || exp > MAX_EXPONENT || exp < -MAX_EXPONENT) throw new EconomyError('bad_decimal', 'exponenten är för stor');
    let digits = BigInt(intPart + frac || '0');
    let scale = frac.length - exp;
    if (m[1] === '-') digits = -digits;
    return scale >= 0 ? Frac.of(digits, 10n ** BigInt(scale)) : Frac.of(digits * 10n ** BigInt(-scale));
  }

  // ---------- Money ----------
  function checkCurrency(c) {
    if (typeof c !== 'string' || !CURRENCY_RE.test(c)) throw new EconomyError('bad_currency', 'valutakod måste vara tre versaler, till exempel SEK');
    return c;
  }

  class Money {
    constructor(amount, currency) { this.amount = amount; this.currency = currency; Object.freeze(this); }
    /** `amount` är hela ören. */
    static of(amount, currency) { return new Money(toBig(amount, 'beloppet'), checkCurrency(currency === undefined ? 'SEK' : currency)); }
    static zero(currency) { return Money.of(0n, currency); }
    /** Kronor som text eller tal ("186,50"). Fler än två decimaler avvisas, de avrundas aldrig tyst. */
    static fromDecimal(v, currency) {
      const minor = parseDecimal(v).mul(MINOR_PER_MAJOR);
      if (!minor.isInteger()) throw new EconomyError('too_many_decimals', 'ett belopp får ha högst två decimaler: ' + JSON.stringify(v));
      return Money.of(minor.n, currency);
    }
    /** Ett bråk i ören avrundat till hela ören med ett uttalat läge. */
    static fromFrac(frac, mode, currency) { return Money.of(roundInt(frac, mode), currency); }
    static fromJSON(o) { return Money.of(toBig(o.amount, 'amount'), o.currency); }
    static sum(list, currency) { let s = Money.zero(currency); for (const x of list) s = s.add(x); return s; }
    same(o) { if (!(o instanceof Money)) throw new EconomyError('not_money', 'ett belopp väntades'); if (o.currency !== this.currency) throw new EconomyError('currency_mismatch', 'olika valutor: ' + this.currency + ' och ' + o.currency); }
    add(o) { this.same(o); return new Money(this.amount + o.amount, this.currency); }
    sub(o) { this.same(o); return new Money(this.amount - o.amount, this.currency); }
    neg() { return new Money(-this.amount, this.currency); }
    abs() { return new Money(babs(this.amount), this.currency); }
    cmp(o) { this.same(o); return this.amount < o.amount ? -1 : this.amount > o.amount ? 1 : 0; }
    eq(o) { return this.cmp(o) === 0; }
    lt(o) { return this.cmp(o) < 0; }
    lte(o) { return this.cmp(o) <= 0; }
    gt(o) { return this.cmp(o) > 0; }
    gte(o) { return this.cmp(o) >= 0; }
    isZero() { return this.amount === 0n; }
    isNegative() { return this.amount < 0n; }
    toFrac() { return Frac.of(this.amount); }
    toDecimalString() {
      const a = babs(this.amount), cents = a % MINOR_PER_MAJOR;
      return (this.amount < 0n ? '-' : '') + (a / MINOR_PER_MAJOR) + '.' + (cents < 10n ? '0' : '') + cents;
    }
    toString() { return this.toDecimalString() + ' ' + this.currency; }
    toJSON() { return { amount: this.amount.toString(), currency: this.currency }; }
  }

  // ---------- procentsatser (hundradels procent, "bp") ----------
  const Rate = {
    /** "25", "12,5", 25, 12.5 → 2500, 1250. Fler än två decimaler i procent avvisas. */
    fromPercent(v) {
      const bp = parseDecimal(v).mul(100n);
      if (!bp.isInteger()) throw new EconomyError('bad_rate', 'en procentsats får ha högst två decimaler: ' + JSON.stringify(v));
      if (bp.isNegative()) throw new EconomyError('bad_rate', 'en procentsats får inte vara negativ');
      return toSafeInt(bp.n);
    },
    /** Heltal bp som bråk: 2500 → 1/4. */
    toFrac(bp) { return Frac.of(toBig(bp, 'procentsats'), 10000n); },
    toPercentString(bp) {
      const b = toBig(bp, 'procentsats');
      const whole = b / 100n, rest = b % 100n;
      return rest === 0n ? String(whole) : whole + '.' + ((rest < 10n ? '0' : '') + rest).replace(/0$/, '');
    },
    check(bp, what) {
      if (!Number.isSafeInteger(bp) || bp < 0) throw new EconomyError('bad_rate', (what || 'procentsatsen') + ' måste vara ett heltal i hundradels procent, 0 eller mer');
      return bp;
    }
  };

  return { ROUNDING, EconomyError, Frac, Money, Rate, roundInt, roundToStep, parseDecimal, toSafeInt };
});

<script>
/* Buketträknaren: belopp med moms uppdelad (Amounts).
 *
 * Ett Amounts-värde bär samma uppgift på alla ställen där ett pris förekommer (inköp, försäljning, rad, faktura):
 *   exVat     belopp utan moms          Money eller null (okänt)
 *   vatRate   momssats i hundradels %   heltal eller null (okänd)
 *   vat       momsbelopp                Money eller null
 *   incVat    belopp med moms           Money eller null
 *   basis     'ex' | 'inc' | 'stated'   vilket tal som var det observerade. Resten härleds av koden, aldrig av AI.
 *   currency, source, verifiedAt, ruleSetRef
 *
 * Okänt är okänt: saknas satsen får man inte ett påhittat momsbelopp. Då är vat och det andra beloppet null.
 * Invariant: exVat + vat = incVat exakt, när alla tre är kända (kontrolleras av validate).
 *
 * Härledning:  moms ur exkl. moms     vat = HALF_UP(exVat × sats)
 *              exkl. moms ur inkl.    exVat = HALF_UP(incVat ÷ (1 + sats)),  vat = incVat − exVat
 * Inkl. moms är sanningen när det är det som är angivet (till exempel kundpriset), så att summan alltid stämmer.
 * Hur moms avrundas på en faktura (per rad eller per sats) avgörs när reglerna verifierats, inte här.
 */
(function (root, factory) {
  var dep = (typeof module === 'object' && module.exports) ? require('./money.js') : root.BRMoney;
  var api = factory(dep);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.BRAmounts = api;
})(typeof self !== 'undefined' ? self : this, function (M) {
  'use strict';
  const { Money, Frac, Rate, ROUNDING, EconomyError } = M;

  const BASES = ['ex', 'inc', 'stated'];

  function meta(m) {
    m = m || {};
    return { source: m.source === undefined ? null : m.source, verifiedAt: m.verifiedAt === undefined ? null : m.verifiedAt, ruleSetRef: m.ruleSetRef === undefined ? null : m.ruleSetRef };
  }
  function money(x, what) { if (!(x instanceof Money)) throw new EconomyError('not_money', what + ' måste vara ett Money-värde'); return x; }
  function rateOk(r) { return r === null || r === undefined ? null : Rate.check(r, 'momssatsen'); }
  const onePlus = bp => Frac.of(1n).add(Rate.toFrac(bp));

  function build(basis, currency, ex, rate, vat, inc, m) {
    return Object.freeze({ exVat: ex, vatRate: rate, vat, incVat: inc, basis, currency, ...meta(m) });
  }

  /** Från belopp exkl. moms. Utan sats blir moms och inkl. moms okända (null). */
  function fromEx(exVat, rateBp, m) {

   *   costLines[]   { id, kind, pricing, cost, markup, salePrice, taxCategory, source }
   *       pricing   'STANDARD_MARKUP' (standard): cost (exkl. avdragsgill moms, Money|Frac) får påslag om markup inte är false
   *                 'FIXED_SALE_PRICE': salePrice { amount, basis: 'inc'|'ex' } är kundens pris direkt. cost är valfri och används bara för marginalen
   *       taxCategory  radens momskategori. Utan den gäller goodsTaxCategory. Satsen slås alltid upp, den gissas aldrig
   *       source    { kind: LIVE|RECENT|STALE|HISTORICAL_ESTIMATE|MANUAL, asOf, ref }
   *   markupBp      påslag i hundradels procent på rader med markup (12000 = 120 %)
   *   labor         { mode:'fixed', fee } | { mode:'timed', minutes, hourlyRate } | { mode:'none' }
   *   fees[]        { id, kind, amount (exkl. moms), taxCategory }, tas inte med påslag
   *   goodsTaxCategory ('arrangement_goods'), laborTaxCategory ('labor')
   *   rounding      { step: Money (till exempel 5 kr), mode: 'CEIL' | 'FLOOR' | 'HALF_UP' }
   *   customerKind  'PRIVATE' | 'BUSINESS'
   * Ger status 'OK', 'EMPTY' eller 'INCOMPLETE'. INCOMPLETE har inget pris och listar orsakerna.
   *
   * BERÄKNAT och PRESENTERAT pris är två skilda saker och båda behålls:
   *   calculated  det exakta beloppet före avrundning (Frac i ören, exkl. moms, moms, inkl. moms, per sats). Ändras aldrig av avrundningsregeln
   *   presented   det avrundade kundpriset (Money) som floristen säger till kunden, med exkl. moms och moms härledda ur det
   * customerPrice, saleExVat, vat och vatByRate är det presenterade priset (kvar under sina gamla namn). Vilket belopp som blir den
   * överenskomna försäljningen avgörs av kundordern, inte av motorn (MASTER-PLAN 8.6).
   */
  function priceArrangement(input) {
    const c = checkCommon(input);
    const { lines, missing } = readCostLines(input.costLines, c.cur);
    const goodsCat = input.goodsTaxCategory || 'arrangement_goods', laborCat = input.laborTaxCategory || 'labor';
    const labor = laborExact(input.labor, c.cur);
    const fees = (input.fees || []).map((f, i) => ({ id: f.id === undefined ? 'avgift' + (i + 1) : f.id, kind: f.kind || 'other', category: f.taxCategory || 'other', ex: nonNeg(amt(f.amount, c.cur, 'avgiften'), 'avgiften') }));
    const statusInfo = classifyPriceStatus(lines);

    const catOf = l => l.taxCategory || goodsCat;
    const reasons = missing.map(m => problem(m.code, { id: m.id }));
    const { resolved, unknown } = resolveAll(input, [goodsCat, laborCat, ...lines.filter(l => l.mode !== 'INCLUDED').map(catOf), ...fees.map(f => f.category)]);
    reasons.push(...unknown);
    if (reasons.length) return { status: 'INCOMPLETE', priceStatus: PRICE_STATUS.INCOMPLETE, currency: c.cur, customerKind: c.kind, reasons, priceMissing: missing.map(m => m.id), customerPrice: null };

    const hasContent = lines.length > 0 || !labor.amount.isZero() || fees.some(f => !f.ex.isZero());
    // inköp med påslag (per momskategori), fasta kundpriser, arbete, avgifter
    const byCat = new Map([[goodsCat, { markupBase: ZERO, noMarkup: ZERO }]]);
    for (const l of lines) {
      if (l.mode !== 'STANDARD_MARKUP') continue;
      const g = byCat.get(catOf(l)) || { markupBase: ZERO, noMarkup: ZERO };
      if (l.markup) g.markupBase = g.markupBase.add(l.cost); else g.noMarkup = g.noMarkup.add(l.cost);
      byCat.set(catOf(l), g);
    }
    const mk = Rate.toFrac(c.markupBp);
    let markupBase = ZERO, noMarkup = ZERO, markupAmount = ZERO, goodsEx = ZERO;
    const goodsComponents = [goodsCat, ...[...byCat.keys()].filter(k => k !== goodsCat).sort()].map(cat => {
      const g = byCat.get(cat), amount = g.markupBase.mul(mk), ex = g.markupBase.add(amount).add(g.noMarkup);
      markupBase = markupBase.add(g.markupBase); noMarkup = noMarkup.add(g.noMarkup); markupAmount = markupAmount.add(amount); goodsEx = goodsEx.add(ex);
      return { key: cat === goodsCat ? 'goods' : 'goods:' + cat, category: cat, rateBp: resolved[cat].rateBp, ex };
    });
    const fixedComponents = lines.filter(l => l.mode === 'FIXED_SALE_PRICE').map(l => {
      const r = resolved[catOf(l)];
      // ett fast pris inkl. moms är exakt det beloppet inkl. moms: exkl. moms härleds ur det utan avrundning
      return { key: 'fixed:' + l.id, category: catOf(l), rateBp: r.rateBp, ex: l.sale.basis === 'inc' ? l.sale.amount.div(onePlus(r.rateBp)) : l.sale.amount };
    });
    const components = [
      ...goodsComponents,
      { key: 'labor', category: laborCat, rateBp: resolved[laborCat].rateBp, ex: labor.amount },
      ...fixedComponents,
      ...fees.map(f => ({ key: 'fee:' + f.id, category: f.category, rateBp: resolved[f.category].rateBp, ex: f.ex }))
    ];
    const groups = groupByRate(components);
    const incExact = Frac.sum(groups.map(g => g.inc));
    const exExact = Frac.sum(groups.map(g => g.ex));
    const P = roundToStep(incExact, c.step, c.mode);            // kundpriset inkl. moms i ören, exakt ett helt antal steg
    const shares = groups.map(g => (incExact.isZero() ? ZERO : g.inc.mul(P).div(incExact)));
    const incInt = allocateWhole(shares, P.n);
    const byRate = groups.map((g, i) => {
      const inc = Money.of(incInt[i], c.cur);
      const a = A.fromInc(inc, g.rateBp);
      return { rateBp: g.rateBp, exVat: a.exVat, vat: a.vat, incVat: a.incVat };
    });
    const sumM = k => byRate.reduce((s, r) => s.add(r[k]), Money.zero(c.cur));
    const customerPrice = sumM('incVat'), saleExVat = sumM('exVat'), vat = sumM('vat');
    const saleExVatExact = Frac.sum(shares.map((s, i) => s.div(onePlus(groups[i].rateBp))));
    const known = lines.filter(l => l.cost !== null);
    const costTotal = Frac.sum(known.map(l => l.cost));
    const margin = saleExVatExact.gt(0n) ? saleExVatExact.sub(costTotal).div(saleExVatExact) : null;

    const resolvedList = Object.values(resolved);
    const status = hasContent ? 'OK' : 'EMPTY';
    const priceStatus = hasContent ? statusInfo.status : null;
    return {
      status, currency: c.cur, customerKind: c.kind,
      priceStatus, statusMark: priceStatus ? STATUS_MARK[priceStatus] : null,
      customerPrice, saleExVat, vat, vatByRate: byRate,
      rounding: P.sub(incExact),
      margin,
      // marginalen är fullständig bara när alla rader har en känd kalkylkostnad (ett fast kundpris kan sakna den)
      marginComplete: known.length === lines.length,
      headline: c.kind === 'BUSINESS' ? { kind: 'EX_VAT_PLUS_VAT', exVat: saleExVat, vat, incVat: customerPrice } : { kind: 'INC_VAT', amount: customerPrice },
      calculated: { exVat: exExact, vat: incExact.sub(exExact), incVat: incExact, byRate: groups.map(g => ({ rateBp: g.rateBp, exVat: g.ex, vat: g.inc.sub(g.ex), incVat: g.inc })) },
      presented: { incVat: customerPrice, exVat: saleExVat, vat, byRate, rounding: P.sub(incExact), roundingRule: { step: c.step, mode: c.mode } },
      breakdown: {
        costLines: lines.map(l => ({ id: l.id, kind: l.kind, pricing: l.mode, priceState: l.mode === 'INCLUDED' ? PRICE_STATE.INCLUDED : l.mode === 'FIXED_SALE_PRICE' ? PRICE_STATE.FIXED : PRICE_STATE.MARKUP,
          cost: l.cost, externalCost: l.externalCost, origin: l.origin, markup: l.markup, salePrice: l.sale, taxCategory: catOf(l), source: l.source })),
        priceSources: { weakest: statusInfo.weakest, counts: PRICE_SOURCE_KINDS.reduce((o, k) => { o[k] = lines.filter(l => l.source && l.source.kind === k).length; return o; }, {}), reasons: statusInfo.reasons },
        materials: { markupBase, noMarkup, total: costTotal },
        markup: { bp: c.markupBp, amount: markupAmount },
        labor: { mode: labor.mode, amount: labor.amount, minutes: labor.minutes || null, hourlyRate: labor.hourlyRate || null },
        fees: fees.map(f => ({ id: f.id, kind: f.kind, category: f.category, exVat: f.ex })),
        goodsExVat: goodsEx,
        fixedPrice: { exVat: Frac.sum(fixedComponents.map(x => x.ex)), lines: fixedComponents.map(x => x.key.slice(6)) },
        components: components.map(x => ({ key: x.key, category: x.category, rateBp: x.rateBp, exVat: x.ex })),
        rule: { refs: refsOf(resolvedList), allVerified: resolvedList.every(r => r.verification === 'verified'), verification: Object.fromEntries(resolvedList.map(r => [r.category, { ruleSetRef: r.ruleSetRef, verification: r.verification, sourceKind: r.sourceKind }])) },
        taxDate: input.taxDate,
        profitabilityInputs: profitabilityInputs({ lines, labor, fees, goodsEx, fixedComponents, customerPrice, saleExVat, vat, exExact, incExact, costTotal })
      },
      exact: { incVatBeforeRounding: incExact, saleExVatBeforeRounding: exExact, vatBeforeRounding: incExact.sub(exExact), saleExVatExact, costTotal }
    };
  }

  // ---------- TARGET CUSTOMER PRICE → AVAILABLE MATERIAL BUDGET ----------
  /**
   * Hur stor råvarubudget (exkl. moms) finns kvar när kunden vill betala `target` inkl. moms?
   * Indata som priceArrangement, men costLines är de FASTA raderna (sådant som redan är bestämt, inklusive egna tillägg med fast
   * kundpris), och:
   *   target            Money, kundens slutpris inkl. moms
   *   budget.markup     true (standard) om råvarubudgeten får påslag
   * Råvarubudgeten ligger i varornas standardkategori (goodsTaxCategory).
   * Bara avrundningsläget CEIL stöds. Det slutpris som kan nås är det största stegvisa pris som är högst `target`.
   * Ger { status: 'OK' | 'NEGATIVE' | 'INCOMPLETE', materialBudget (Frac), materialBudgetMoney (Money, avrundad nedåt), effectiveTarget, shortfall }.
   */
  function budgetForTarget(input) {
    const c = checkCommon(input);
    if (c.mode !== ROUNDING.CEIL) throw new EconomyError('unsupported_rounding', 'budgetForTarget stöder bara avrundning uppåt (CEIL)');
    if (!(input.target instanceof Money) || input.target.currency !== c.cur) throw new EconomyError('bad_target', 'target måste vara ett Money-värde i ' + c.cur);
    const { lines, missing } = readCostLines(input.costLines, c.cur);
    const goodsCat = input.goodsTaxCategory || 'arrangement_goods', laborCat = input.laborTaxCategory || 'labor';
    const labor = laborExact(input.labor, c.cur);
    const fees = (input.fees || []).map((f, i) => ({ id: f.id === undefined ? 'avgift' + (i + 1) : f.id, category: f.taxCategory || 'other', ex: nonNeg(amt(f.amount, c.cur, 'avgiften'), 'avgiften') }));
    const catOf = l => l.taxCategory || goodsCat;
    const reasons = missing.map(m => problem(m.code, { id: m.id }));
    const { resolved, unknown } = resolveAll(input, [goodsCat, laborCat, ...lines.filter(l => l.mode !== 'INCLUDED').map(catOf), ...fees.map(f => f.category)]);
    reasons.push(...unknown);
    if (reasons.length) return { status: 'INCOMPLETE', reasons, currency: c.cur };

    const m = Rate.toFrac(c.markupBp);
    const effectiveTarget = roundToStep(input.target.toFrac(), c.step, ROUNDING.FLOOR);   // största stegvisa pris som är högst målet
    let fixedMarked = ZERO, fixedPlain = ZERO, otherInc = ZERO;                           // bestämt inom standardkategorin, och bestämt utanför den
    for (const l of lines) {
      if (l.mode === 'INCLUDED') continue;                                               // "ingår" bidrar med 0 kr
      const r = onePlus(resolved[catOf(l)].rateBp);
      if (l.mode === 'FIXED_SALE_PRICE') { otherInc = otherInc.add(l.sale.basis === 'inc' ? l.sale.amount : l.sale.amount.mul(r)); continue; }
      if (catOf(l) === goodsCat) { if (l.markup) fixedMarked = fixedMarked.add(l.cost); else fixedPlain = fixedPlain.add(l.cost); }
      else otherInc = otherInc.add((l.markup ? l.cost.mul(ONE.add(m)) : l.cost).mul(r));
    }
    const laborInc = labor.amount.mul(onePlus(resolved[laborCat].rateBp));
    const feesInc = Frac.sum(fees.map(f => f.ex.mul(onePlus(resolved[f.category].rateBp))));
    const goodsExAllowed = effectiveTarget.sub(laborInc).sub(feesInc).sub(otherInc).div(onePlus(resolved[goodsCat].rateBp));
    const budgetMarkup = !input.budget || input.budget.markup !== false;
    const material = budgetMarkup
      ? goodsExAllowed.sub(fixedPlain).div(ONE.add(m)).sub(fixedMarked)
      : goodsExAllowed.sub(fixedPlain).sub(fixedMarked.mul(ONE.add(m)));
    const breakdown = { effectiveTarget, laborIncVat: laborInc, feesIncVat: feesInc, otherIncVat: otherInc, goodsExVatAllowed: goodsExAllowed, fixedMarked, fixedPlain, markup: { bp: c.markupBp, appliesToBudget: budgetMarkup } };
    if (material.isNegative()) return { status: 'NEGATIVE', currency: c.cur, effectiveTarget: Money.fromFrac(effectiveTarget, ROUNDING.FLOOR, c.cur), shortfall: material.neg(), materialBudget: material, materialBudgetMoney: null, breakdown };
    return { status: 'OK', currency: c.cur, effectiveTarget: Money.fromFrac(effectiveTarget, ROUNDING.FLOOR, c.cur), materialBudget: material, materialBudgetMoney: Money.fromFrac(material, ROUNDING.FLOOR, c.cur), shortfall: null, breakdown };
  }

  // ---------- överenskommet pris ----------
  /**
   * Delar ett ÖVERENSKOMMET pris (inkl. moms) på momssatser, så att exkl. moms och moms summerar exakt till det överenskomna beloppet.
   * Det överenskomna priset kan vara lägre eller högre än det presenterade (beräknat 667,75 kr, presenterat 670 kr, sålt för 650 kr).
   * Fördelningen följer det presenterade prisets fördelning per sats (presentedByRate). Är det presenterade priset 0 används fallbackRateBp
   * (satsen för varor), annars inget överenskommet belopp över 0. Den ursprungliga kalkylen ändras aldrig av detta.
   * Ger { incVat, exVat, vat, byRate[{ rateBp, exVat, vat, incVat }] } (Money).
   */
  function allocateAgreed(spec) {
    const agreed = spec.agreedIncVat;
    if (!(agreed instanceof Money)) throw new EconomyError('not_money', 'agreedIncVat måste vara Money');
    if (agreed.isNegative()) throw new EconomyError('negative_amount', 'ett överenskommet pris får inte vara negativt');
    const cur = agreed.currency;
    const groups = (spec.presentedByRate || []).filter(g => g.incVat.amount > 0n);
    let shares, rates;
    if (groups.length) {
      const total = Frac.sum(groups.map(g => g.incVat.toFrac()));
      shares = groups.map(g => agreed.toFrac().mul(g.incVat.toFrac()).div(total));
      rates = groups.map(g => g.rateBp);
    } else if (agreed.isZero()) {
      return { incVat: agreed, exVat: Money.zero(cur), vat: Money.zero(cur), byRate: [] };
    } else {
      if (spec.fallbackRateBp === undefined || spec.fallbackRateBp === null) throw new EconomyError('no_rate_for_agreed', 'det presenterade priset är 0 och ingen momssats finns för det överenskomna beloppet');
      shares = [agreed.toFrac()]; rates = [Rate.check(spec.fallbackRateBp, 'momssatsen')];
    }
    const inc = allocateWhole(shares, agreed.amount);
    const merged = new Map();
    rates.forEach((r, i) => {
      const a = A.fromInc(Money.of(inc[i], cur), r);
      const g = merged.get(r) || { rateBp: r, exVat: Money.zero(cur), vat: Money.zero(cur), incVat: Money.zero(cur) };
      g.exVat = g.exVat.add(a.exVat); g.vat = g.vat.add(a.vat); g.incVat = g.incVat.add(a.incVat); merged.set(r, g);
    });
    const byRate = [...merged.values()].sort((a, b) => a.rateBp - b.rateBp);
    const sum = k => byRate.reduce((s, g) => s.add(g[k]), Money.zero(cur));
    return { incVat: sum('incVat'), exVat: sum('exVat'), vat: sum('vat'), byRate };
  }

  // ---------- ett jobb: flera arrangemang och jobbavgifter ----------
  /**
   * Summerar ett jobb. lines: [{ id, qty, arrangement: <indata till priceArrangement> }] och fees: [{ id, basis: 'ex'|'inc', amount, taxCategory }].
   * Varje arrangemang avrundas för sig (som i dag), och antal multipliceras på de redan avrundade beloppen.
   * Momsen per sats är summan av raderna ('line'). Avrundning per sats ('rate_summary') är inte byggd och avvisas uttryckligen.
   * Gemensamma fält (currency, taxDate, ruleSets, rounding, customerKind) ärvs av raderna om de inte anger egna.
   */
  function priceJob(job) {
    const cur = job.currency || 'SEK', kind = job.customerKind || 'PRIVATE';
    if (!CUSTOMER_KINDS.includes(kind)) throw new EconomyError('bad_customer_kind', 'okänd kundtyp: ' + kind);
    const sel = T.selectRuleSet(job.ruleSets || [], job.taxDate);
    if (sel.ok && sel.ruleSet.roundingLevel !== 'line') throw new EconomyError('unsupported_rounding_level', 'momsavrundning per sats (rate_summary) är inte byggd ännu');
    const common = { currency: cur, taxDate: job.taxDate, ruleSets: job.ruleSets, rounding: job.rounding, customerKind: kind };
    const results = [], reasons = [];
    for (const l of job.lines || []) {
      if (!Number.isSafeInteger(l.qty) || l.qty < 1) throw new EconomyError('bad_qty', 'antalet måste vara ett heltal från 1');
      const r = priceArrangement({ ...common, ...l.arrangement });
      results.push({ id: l.id, qty: l.qty, result: r });
      if (r.status === 'INCOMPLETE') reasons.push(problem('line_incomplete', { id: l.id, reasons: r.reasons }));
    }
    const feeAmounts = [];
    for (const [i, f] of (job.fees || []).entries()) {
      const id = f.id === undefined ? 'avgift' + (i + 1) : f.id, cat = f.taxCategory || 'other';
      const r = T.resolveRate(job.ruleSets || [], cat, job.taxDate);
      if (!r.ok) { reasons.push(problem('tax_unknown', { id, category: cat, reason: r.reason })); continue; }
      if (!(f.amount instanceof Money) || f.amount.currency !== cur) throw new EconomyError('bad_fee', 'avgiften måste vara Money i ' + cur);
      feeAmounts.push({ id, category: cat, basis: f.basis === 'inc' ? 'inc' : 'ex', amounts: f.basis === 'inc' ? A.fromInc(f.amount, r.rateBp) : A.fromEx(f.amount, r.rateBp), ruleSetRef: r.ruleSetRef, verification: r.verification });
    }
    if (reasons.length) return { status: 'INCOMPLETE', priceStatus: PRICE_STATUS.INCOMPLETE, currency: cur, reasons };

    const byRate = new Map();
    const add = (rateBp, ex, vat, inc) => { const g = byRate.get(rateBp) || { rateBp, exVat: Money.zero(cur), vat: Money.zero(cur), incVat: Money.zero(cur) }; g.exVat = g.exVat.add(ex); g.vat = g.vat.add(vat); g.incVat = g.incVat.add(inc); byRate.set(rateBp, g); };
    const times = (m, n) => Money.of(m.amount * BigInt(n), cur);
    for (const r of results) for (const g of r.result.vatByRate) add(g.rateBp, times(g.exVat, r.qty), times(g.vat, r.qty), times(g.incVat, r.qty));
    for (const f of feeAmounts) add(f.amounts.vatRate, f.amounts.exVat, f.amounts.vat, f.amounts.incVat);
    const vatByRate = [...byRate.values()].sort((a, b) => a.rateBp - b.rateBp);
    const sum = k => vatByRate.reduce((s, g) => s.add(g[k]), Money.zero(cur));
    const lineStatuses = results.filter(r => r.result.status === 'OK').map(r => r.result.priceStatus);
    const priceStatus = lineStatuses.length === 0 ? null : lineStatuses.every(s => s === PRICE_STATUS.CONFIRMED) ? PRICE_STATUS.CONFIRMED : PRICE_STATUS.ESTIMATED;
    const refs = [...new Set([...results.flatMap(r => r.result.status === 'OK' ? r.result.breakdown.rule.refs : []), ...feeAmounts.map(f => f.ruleSetRef)])];
    const allVerified = results.every(r => r.result.status !== 'OK' || r.result.breakdown.rule.allVerified) && feeAmounts.every(f => f.verification === 'verified');
    const totalExVat = sum('exVat'), totalVat = sum('vat'), totalIncVat = sum('incVat');
    // beräknat (exakt, före avrundning) mot presenterat (avrundat per arrangemang). Jobbavgifter är exakta belopp och avrundas inte.
    const qtyFrac = n => Frac.of(BigInt(n));
    const calcInc = Frac.sum([...results.filter(r => r.result.status !== 'EMPTY').map(r => r.result.calculated.incVat.mul(qtyFrac(r.qty))), ...feeAmounts.map(f => f.amounts.incVat.toFrac())]);
    const calcEx = Frac.sum([...results.filter(r => r.result.status !== 'EMPTY').map(r => r.result.calculated.exVat.mul(qtyFrac(r.qty))), ...feeAmounts.map(f => f.amounts.exVat.toFrac())]);
    return {
      status: 'OK', currency: cur, customerKind: kind, priceStatus, statusMark: priceStatus ? STATUS_MARK[priceStatus] : null,
      lines: results.map(r => ({ id: r.id, qty: r.qty, result: r.result, lineIncVat: r.result.customerPrice ? times(r.result.customerPrice, r.qty) : Money.zero(cur) })),
      fees: feeAmounts.map(f => ({ id: f.id, category: f.category, amounts: f.amounts })),
      vatByRate, totalExVat, totalVat, totalIncVat,
      calculated: { exVat: calcEx, vat: calcInc.sub(calcEx), incVat: calcInc },
      presented: { exVat: totalExVat, vat: totalVat, incVat: totalIncVat, rounding: totalIncVat.toFrac().sub(calcInc) },
      headline: kind === 'BUSINESS' ? { kind: 'EX_VAT_PLUS_VAT', exVat: totalExVat, vat: totalVat, incVat: totalIncVat } : { kind: 'INC_VAT', amount: totalIncVat },
      rule: { refs, allVerified, roundingLevel: 'line' }
    };
  }

  return {
    PRICE_SOURCE_KINDS, PRICE_STATUS, STATUS_MARK, CUSTOMER_KINDS, COST_KINDS, PRICING_MODES, PRICE_BASIS, PRICE_STATE, normalizeBasis,
    marginFromMarkup, markupFromMargin, suggestMarkupBpFromMarginBp,
    resolveLabor, laborExact, classifyPriceStatus,
    priceArrangement, budgetForTarget, priceJob, allocateAgreed
  };
});

</script>
<script>
/* Buketträknaren: inköpsplan i exakt aritmetik (hela förpackningar, delning mellan arrangemang, hemmalager och frakt).
 *
 * Det här är den första halvan av den gamla räknemotorn calc(), flyttad till exakta tal. calc() ligger kvar orörd som referensmotor
 * och motorerna jämförs mot varandra i test/purchase-differential.test.mjs på de 145 sparade tillstånden.
 *
 * VAD SOM ANVÄNDS I ARRANGEMANGET är en sak. VAD SOM MÅSTE BESTÄLLAS är en annan. Den här planen får bara de rader som faktiskt
 * ska anskaffas från en grossist (arrangemangsrader med requiresPurchase). Egna tillägg, material från eget lager och blommor från
 * egen trädgård kommer aldrig hit och skapar därför aldrig något inköpsbehov.
 *
 * Indata:
 *   currency

  /** Kundtypen för ett arrangemang (via jobbet och kunden). Utan kund gäller privatkund. */
  function customerKindOf(st, arrangementId) {
    const a = byId(st.arrangements, arrangementId), ev = a && byId(st.events, a.eventId), c = ev && ev.customerId ? byId(st.customers, ev.customerId) : null;
    return c ? c.customerKind : 'PRIVATE';
  }
  function addItem(st, ctx, arrangementId, spec) {
    need(st.arrangements, arrangementId, 'arrangemang');
    const normalized = I.normalizeItem({ ...(spec || {}), id: ctx.newId('itm') }, { currency: st.shop.pricing.currency, defaultBasis: I.defaultPriceBasis(customerKindOf(st, arrangementId)) });
    const now = ctx.now();
    const it = { ...normalized, arrangementId, shopId: SHOP_ID, createdAt: now, updatedAt: now, rev: 1, deletedAt: null };
    st.items.push(it);
    return it;
  }
  function updateItem(st, ctx, id, patch) {
    const it = need(st.items, id, 'rad'), p = patch || {};
    const merged = { ...it, ...p, pricing: { ...it.pricing, ...(p.pricing || {}) } };
    const normalized = I.normalizeItem(merged, { currency: st.shop.pricing.currency, defaultBasis: I.defaultPriceBasis(customerKindOf(st, it.arrangementId)) });
    Object.assign(it, normalized);
    return touch(ctx, it);
  }
  function removeItem(st, ctx, id) { const it = need(st.items, id, 'rad'); it.deletedAt = ctx.now(); return touch(ctx, it); }
  function removeArrangement(st, ctx, id) {
    const a = need(st.arrangements, id, 'arrangemang');
    for (const it of live(st.items)) if (it.arrangementId === a.id) { it.deletedAt = ctx.now(); touch(ctx, it); }
    a.deletedAt = ctx.now();
    return touch(ctx, a);
  }
  function removeEvent(st, ctx, id) {
    const e = need(st.events, id, 'jobb');
    for (const a of live(st.arrangements)) if (a.eventId === e.id) removeArrangement(st, ctx, a.id);
    e.deletedAt = ctx.now();
    return touch(ctx, e);
  }

  // ---------- frågor ----------
  const customers = st => live(st.customers);
  const eventsOf = (st, customerId) => live(st.events).filter(e => customerId === undefined || e.customerId === customerId);
  const arrangementsOf = (st, eventId) => live(st.arrangements).filter(a => a.eventId === eventId);
  const itemsOf = (st, arrangementId) => live(st.items).filter(i => i.arrangementId === arrangementId);

  /**
   * VAD SOM ANVÄNDS och VAD SOM MÅSTE BESTÄLLAS för ett jobb.
   *   used           alla rader, i alla arrangemang (det som påverkar kundpriset)
   *   wholesaler     bara grossistartiklar som ska beställas, summerade per artikel över alla arrangemang
   *   elsewhere      rader som ska köpas någon annanstans än hos grossisten (MANUAL med requiresPurchase)
   *   notOrdered     rader som används men inte beställs (eget lager, egen trädgård, ...)
   */
  function purchaseNeeds(st, eventId) {
    need(st.events, eventId, 'jobb');
    const used = [], wholesale = new Map(), elsewhere = [], notOrdered = [];
    for (const a of arrangementsOf(st, eventId)) for (const it of itemsOf(st, a.id)) {
      const qty = I.quantityOf(it).mul(Frac.of(BigInt(a.quantity)));
      used.push({ itemId: it.id, arrangementId: a.id, source: it.source, name: it.name, quantity: qty });
      const n = I.purchaseNeed(it);
      if (n === 'WHOLESALER') {
        const key = I.articleKey(it.articleRef), row = wholesale.get(key) || { articleKey: key, articleRef: it.articleRef, needed: Frac.of(0n), lines: [] };
        row.needed = row.needed.add(qty); row.lines.push({ arrangementId: a.id, itemId: it.id }); wholesale.set(key, row);
      } else if (n === 'ELSEWHERE') elsewhere.push({ itemId: it.id, arrangementId: a.id, name: it.name, quantity: qty });
      else notOrdered.push({ itemId: it.id, arrangementId: a.id, source: it.source, name: it.name, quantity: qty });
    }
    return { used, wholesaler: [...wholesale.values()], elsewhere, notOrdered };
  }

  // ---------- pris ----------
  const laborJson = j => (j.mode === 'fixed' ? { mode: 'fixed', fee: Money.fromJSON(j.fee) } : { mode: 'timed', minutes: M.parseDecimal(j.minutes), hourlyRate: Money.fromJSON(j.hourlyRate) });

  /**
   * Räknar priset för ett jobb. opts:
   *   catalog    { [connectionId:supplierProductId]: { name, packSize, packPrice: Money|null, source } }  grossistens artiklar och priser
   *   taxDate    datum som styr momssatsen. Utan det används leveransdatum, annars eventdatum, annars opts.today
   *   today      'ÅÅÅÅ-MM-DD' om jobbet saknar datum
   *   ruleSets   regeluppsättningar. Utan dem används floristens egen momsinställning (inte verifierad)
   *   customerKind  överstyr kundtypen
   * Ger { status, purchaseComplete, plan, needs, arrangements[{ arrangementId, name, quantity, result }], job }.
   */
  function priceEvent(st, eventId, opts) {
    const o = opts || {};
    const ev = need(st.events, eventId, 'jobb');
    const pr = readPricing(st.shop.pricing);
    const cur = pr.cur;
    const taxDate = o.taxDate || ev.deliveryDate || ev.eventDate || o.today;
    if (!isDate(taxDate)) fail('no_tax_date', 'jobbet saknar datum för momssatsen (ange taxDate eller today)', 'taxDate');
    const ruleSets = o.ruleSets || [T.legacyUserSettingRuleSet(pr.legacyVatPercent)];
    const customer = ev.customerId ? byId(st.customers, ev.customerId) : null;
    const customerKind = o.customerKind || (customer && customer.customerKind) || 'PRIVATE';
    const arrs = arrangementsOf(st, eventId);
    const catalog = o.catalog || {};

    // 1. inköpsplan: bara grossistartiklar som ska beställas
    const plan = PU.planPurchase({
      currency: cur, packMode: pr.packMode, catalog, onHand: ev.onHand,
      shipping: { fee: pr.shipFee, freeFrom: pr.freeFrom },
      arrangements: arrs.map(a => {
        const items = itemsOf(st, a.id);
        return { id: a.id, quantity: a.quantity, nonEmpty: items.length > 0,
          items: items.filter(it => I.purchaseNeed(it) === 'WHOLESALER').map(it => ({ id: it.id, articleKey: I.articleKey(it.articleRef), quantity: I.quantityOf(it) })) };
      })
    });

    // 2. pris per arrangemang
    const common = { currency: cur, taxDate, ruleSets, rounding: { step: pr.step, mode: pr.mode }, customerKind };
    const inputs = arrs.map(a => {
      const items = itemsOf(st, a.id), planned = plan.arrangements.find(x => x.id === a.id);
      if (items.length === 0) return { a, input: { ...common, costLines: [], labor: { mode: 'none' }, markupBp: 0 } };
      const costLines = items.map(it => I.itemToCostLine(it, planned.items.find(x => x.itemId === it.id)));
      if (planned.freightShare.gt(0n)) costLines.push({ id: 'frakt', kind: 'freight', cost: planned.freightShare, markup: true, source: { kind: 'MANUAL', ref: 'shipping-setting' } });
      const labor = P.resolveLabor({ defaultLaborFee: pr.defaultFee, hourlyLaborRate: pr.hourly }, { laborOverride: a.laborOverride ? laborJson(a.laborOverride) : undefined, estimatedMinutes: a.estimatedMinutes });
      return { a, input: { ...common, costLines, labor, markupBp: a.markupOverrideBp === null ? pr.markupBp : a.markupOverrideBp, goodsTaxCategory: pr.goodsCat, laborTaxCategory: pr.laborCat } };
    });
    const results = inputs.map(x => ({ arrangementId: x.a.id, name: x.a.name, quantity: x.a.quantity, result: P.priceArrangement(x.input) }));

    // 3. jobbets summa
    const job = P.priceJob({
      ...common,
      lines: inputs.map(x => ({ id: x.a.id, qty: x.a.quantity, arrangement: x.input })),
      fees: (ev.fees || []).map(f => ({ id: f.id, basis: f.basis, amount: Money.fromJSON(f.amount), taxCategory: f.taxCategory }))
    });
    // kundpriset kan vara fullständigt även om ett grossistpris saknas (till exempel för en rad med fast kundpris). Det redovisas för sig.
    return { status: job.status === 'OK' ? 'OK' : 'INCOMPLETE', purchaseComplete: plan.missing.length === 0 && plan.noPrice.length === 0, eventId, taxDate, customerKind, plan, needs: purchaseNeeds(st, eventId), arrangements: results, job };
  }

  // ---------- offert (QuoteSnapshot) och kundorder (CustomerOrder) ----------
  const QUOTE_STATUS = Object.freeze(['draft', 'sent', 'accepted', 'superseded']);
  const ORDER_STATUS = Object.freeze(['active', 'superseded', 'cancelled']);
  const QUOTE_NEXT = Object.freeze({ draft: ['sent', 'accepted', 'superseded'], sent: ['accepted', 'superseded'], accepted: ['superseded'], superseded: [] });
  const ORDER_NEXT = Object.freeze({ active: ['superseded', 'cancelled'], superseded: [], cancelled: [] });
  const jsonOf = x => JSON.parse(JSON.stringify(x));
  const times = (m, n) => Money.of(m.amount * BigInt(n), m.currency);
  const sumMoney = (list, cur) => list.reduce((s, x) => s.add(x), Money.zero(cur));
  const sumFrac = list => Frac.sum(list);
  const quotesOf = (st, eventId) => (st.quotes || []).filter(q => q.eventId === eventId && q.deletedAt === null);
  const ordersOf = (st, eventId) => (st.orders || []).filter(o => o.eventId === eventId && o.deletedAt === null);
  const activeOrderOf = (st, eventId) => ordersOf(st, eventId).find(o => o.status === 'active') || null;

  /** Moms per sats, sammanslagen över flera listor av { rateBp, exVat, vat, incVat } (Money). */
  function mergeRates(lists, cur) {
    const map = new Map();
    for (const g of lists.flat()) {
      const x = map.get(g.rateBp) || { rateBp: g.rateBp, exVat: Money.zero(cur), vat: Money.zero(cur), incVat: Money.zero(cur) };
      x.exVat = x.exVat.add(g.exVat); x.vat = x.vat.add(g.vat); x.incVat = x.incVat.add(g.incVat); map.set(g.rateBp, x);
    }
    return [...map.values()].sort((a, b) => a.rateBp - b.rateBp);
  }
  const moneyRates = list => list.map(g => ({ rateBp: g.rateBp, exVat: Money.fromJSON(g.exVat), vat: Money.fromJSON(g.vat), incVat: Money.fromJSON(g.incVat) }));
  const ratesJson = list => list.map(g => ({ rateBp: g.rateBp, exVat: g.exVat.toJSON(), vat: g.vat.toJSON(), incVat: g.incVat.toJSON() }));

  /**
   * Fryser jobbets pris som en offert. Både det BERÄKNADE (exakta) och det PRESENTERADE (avrundade) priset sparas, med avrundningsregel,
   * regelversion och prisstatus. Kräver ett fullständigt pris: en offert med ett pris som saknas skapas aldrig. Tidigare offerter för jobbet
   * som inte är godkända ersätts (superseded). opts som för priceEvent.
   */
  function createQuote(st, ctx, eventId, opts) {
    need(st.events, eventId, 'jobb');
    const res = priceEvent(st, eventId, opts);
    if (res.status !== 'OK') {
      const why = res.arrangements.filter(a => a.result.status === 'INCOMPLETE').map(a => a.name + ': ' + a.result.reasons.map(r => r.code + (r.id ? ' ' + r.id : '') + (r.category ? ' ' + r.category : '')).join(', '));
      fail('incomplete_price', 'offerten kan inte skapas medan priset är ofullständigt' + (why.length ? ' (' + why.join('; ') + ')' : ''), 'quote');
    }
    const pr = readPricing(st.shop.pricing), cur = pr.cur;
    const priced = res.arrangements.filter(a => a.result.status === 'OK');
    if (!priced.length && !res.job.fees.length) fail('empty_job', 'jobbet har inget att offerera', 'quote');
    const lines = priced.map(a => ({
      arrangementId: a.arrangementId, name: a.name, quantity: a.quantity, priceStatus: a.result.priceStatus,
      calculated: jsonOf(a.result.calculated), presented: jsonOf(a.result.presented), goodsRateBp: a.result.breakdown.components[0].rateBp,
      ruleSetRefs: a.result.breakdown.rule.refs, allVerified: a.result.breakdown.rule.allVerified,
      profitabilityInputs: jsonOf(a.result.breakdown.profitabilityInputs)
    }));
    const version = (quotesOf(st, eventId).reduce((m, q) => Math.max(m, q.version), 0)) + 1;
    for (const q of quotesOf(st, eventId)) if (q.status === 'draft' || q.status === 'sent') { q.status = 'superseded'; q.supersededAt = ctx.now(); touch(ctx, q); }
    const q = stamp(ctx, 'qte', {
      eventId, version, status: 'draft', sentAt: null, acceptedAt: null, supersededAt: null,
      currency: cur, taxDate: res.taxDate, customerKind: res.customerKind, rounding: { step: pr.step.toJSON(), mode: pr.mode },
      priceStatus: res.job.priceStatus, ruleSetRefs: res.job.rule.refs, allVerified: res.job.rule.allVerified,
      lines, fees: jsonOf(res.job.fees),
      totals: { calculated: jsonOf(res.job.calculated), presented: jsonOf(res.job.presented), vatByRate: jsonOf(res.job.vatByRate) }
    });
    st.quotes = st.quotes || [];
    st.quotes.push(q);
    return q;
  }

  function sendQuote(st, ctx, quoteId) {
    const q = need(st.quotes || [], quoteId, 'offert');
    if (q.status !== 'draft') fail('bad_transition', 'bara ett utkast kan skickas (offerten är ' + q.status + ')', 'quote');
    q.status = 'sent'; q.sentAt = ctx.now();
    return touch(ctx, q);
  }

  /**
   * Kunden säger ja. Skapar en kundorder av offerten och fryser det ÖVERENSKOMNA priset per arrangemang.
   * opts: { approvedBy (vem hos floristen som registrerade kundens ja), agreed: { [arrangementId]: belopp per styck inkl. moms (Money som JSON) }, note }
   * Saknas ett överenskommet pris för ett arrangemang gäller det presenterade. Ett lägre eller högre överenskommet pris ändrar aldrig offerten:
   * skillnaden mot det presenterade och mot det beräknade sparas på raden.
   */
  function acceptQuote(st, ctx, quoteId, opts) {
    const o = opts || {};
    const q = need(st.quotes || [], quoteId, 'offert');
    if (q.status !== 'draft' && q.status !== 'sent') fail('bad_transition', 'bara en offert som inte är ersatt kan godkännas (offerten är ' + q.status + ')', 'quote');
    const approvedBy = text(o.approvedBy, 'vem som godkände', true);
    const agreedIn = o.agreed || {};
    for (const k of Object.keys(agreedIn)) if (!q.lines.some(l => l.arrangementId === k)) fail('bad_agreed', 'överenskommet pris för ett arrangemang som inte finns i offerten: ' + k, 'agreed');
    const cur = q.currency;
    const lines = q.lines.map(l => {
      let unit;
      if (agreedIn[l.arrangementId] === undefined) unit = Money.fromJSON(l.presented.incVat);
      else { try { unit = Money.fromJSON(agreedIn[l.arrangementId]); } catch (e) { fail('bad_agreed', 'det överenskomna priset måste vara ett belopp', 'agreed'); } }
      if (unit.currency !== cur || unit.isNegative()) fail('bad_agreed', 'det överenskomna priset måste vara icke-negativt i ' + cur, 'agreed');
      const split = P.allocateAgreed({ agreedIncVat: unit, presentedByRate: moneyRates(l.presented.byRate), fallbackRateBp: l.goodsRateBp });
      const presentedInc = Money.fromJSON(l.presented.incVat);
      return {
        arrangementId: l.arrangementId, name: l.name, quantity: l.quantity,
        calculated: clone(l.calculated), presented: { incVat: l.presented.incVat, exVat: l.presented.exVat, vat: l.presented.vat },
        agreed: { unitIncVat: split.incVat.toJSON(), unitExVat: split.exVat.toJSON(), unitVat: split.vat.toJSON(), byRate: ratesJson(split.byRate) },
        adjustment: { unitIncVat: split.incVat.sub(presentedInc).toJSON(), unitVsCalculated: split.incVat.toFrac().sub(Frac.fromJSON(l.calculated.incVat)).toJSON() }
      };
    });
    const feeAmounts = q.fees.map(f => ({ ex: Money.fromJSON(f.amounts.exVat), vat: Money.fromJSON(f.amounts.vat), inc: Money.fromJSON(f.amounts.incVat), rateBp: f.amounts.vatRate }));
    const feeRates = feeAmounts.map(f => ({ rateBp: f.rateBp, exVat: f.ex, vat: f.vat, incVat: f.inc }));
    const lineRates = lines.map(l => moneyRates(l.agreed.byRate).map(g => ({ rateBp: g.rateBp, exVat: times(g.exVat, l.quantity), vat: times(g.vat, l.quantity), incVat: times(g.incVat, l.quantity) })));
    const byRate = mergeRates([...lineRates, feeRates], cur);
    const agreedInc = sumMoney(byRate.map(g => g.incVat), cur);
    const presentedInc = Money.fromJSON(q.totals.presented.incVat);
    const prior = ordersOf(st, q.eventId);
    for (const x of prior) if (x.status === 'active') { x.status = 'superseded'; x.supersededAt = ctx.now(); touch(ctx, x); }
    for (const x of quotesOf(st, q.eventId)) if (x.id !== q.id && x.status === 'accepted') { x.status = 'superseded'; x.supersededAt = ctx.now(); touch(ctx, x); }
    const order = stamp(ctx, 'ord', {
      eventId: q.eventId, quoteId: q.id, quoteVersion: q.version, version: prior.reduce((m, x) => Math.max(m, x.version), 0) + 1, status: 'active',
      approvedAt: ctx.now(), approvedBy, note: text(o.note), supersededAt: null,
      currency: cur, taxDate: q.taxDate, customerKind: q.customerKind, ruleSetRefs: q.ruleSetRefs, allVerified: q.allVerified,
      lines, fees: clone(q.fees),
      totals: {
        calculatedIncVat: q.totals.calculated.incVat, presentedIncVat: q.totals.presented.incVat,
        agreedIncVat: agreedInc.toJSON(), agreedExVat: sumMoney(byRate.map(g => g.exVat), cur).toJSON(), agreedVat: sumMoney(byRate.map(g => g.vat), cur).toJSON(),
        adjustmentIncVat: agreedInc.sub(presentedInc).toJSON(), vatByRate: ratesJson(byRate)
      }
    });
    st.orders = st.orders || [];
    st.orders.push(order);
    q.status = 'accepted'; q.acceptedAt = ctx.now(); touch(ctx, q);
    return order;
  }

  function cancelOrder(st, ctx, orderId) {
    const o = need(st.orders || [], orderId, 'kundorder');
    if (o.status !== 'active') fail('bad_transition', 'bara en aktiv kundorder kan avbrytas (ordern är ' + o.status + ')', 'order');
    o.status = 'cancelled'; o.supersededAt = ctx.now();
    return touch(ctx, o);
  }

  /** Läser de tre prisnivåerna för en orderrad: beräknat, presenterat och överenskommet (per styck, inkl. moms). */
  function priceLevels(line) {
    return {
      calculatedIncVat: Frac.fromJSON(line.calculated.incVat),
      presentedIncVat: Money.fromJSON(line.presented.incVat),
      agreedIncVat: Money.fromJSON(line.agreed.unitIncVat),
      adjustmentIncVat: Money.fromJSON(line.adjustment.unitIncVat),
      agreedVsCalculated: Frac.fromJSON(line.adjustment.unitVsCalculated)
    };
  }

  /** Kontroll av en offert (lista med problem, tom = bra). */
  function validateQuote(q, cur) {
    const p = [], at = m => prob('bad_quote', 'offert ' + q.id + ': ' + m, q.id);
    try {
      if (!QUOTE_STATUS.includes(q.status)) p.push(at('okänd status ' + q.status));
      if (!Number.isSafeInteger(q.version) || q.version < 1) p.push(at('ogiltig version'));
      if (q.currency !== cur) p.push(at('fel valuta'));
      if (!Array.isArray(q.lines) || !Array.isArray(q.fees)) return [...p, at('rader och avgifter måste vara listor')];
      const incs = [], calcs = [];
      for (const l of q.lines) {
        const pi = Money.fromJSON(l.presented.incVat), pe = Money.fromJSON(l.presented.exVat), pv = Money.fromJSON(l.presented.vat);
        if (!pe.add(pv).eq(pi)) p.push(at('presenterat exkl. moms + moms är inte inkl. moms (' + l.arrangementId + ')'));
        if (!sumMoney(moneyRates(l.presented.byRate).map(g => g.incVat), cur).eq(pi)) p.push(at('momsraderna summerar inte till det presenterade priset (' + l.arrangementId + ')'));
        const ce = Frac.fromJSON(l.calculated.exVat), cv = Frac.fromJSON(l.calculated.vat), ci = Frac.fromJSON(l.calculated.incVat);
        if (!ce.add(cv).eq(ci)) p.push(at('beräknat exkl. moms + moms är inte inkl. moms (' + l.arrangementId + ')'));
        if (!Frac.fromJSON(l.presented.rounding).eq(pi.toFrac().sub(ci))) p.push(at('avrundningen är inte presenterat minus beräknat (' + l.arrangementId + ')'));
        if (!Number.isSafeInteger(l.quantity) || l.quantity < 1) p.push(at('ogiltigt antal'));
        incs.push(times(pi, l.quantity)); calcs.push(ci.mul(Frac.of(BigInt(l.quantity))));
      }
      for (const f of q.fees) { const fi = Money.fromJSON(f.amounts.incVat); incs.push(fi); calcs.push(fi.toFrac()); }
      if (!sumMoney(incs, cur).eq(Money.fromJSON(q.totals.presented.incVat))) p.push(at('summan av raderna är inte det presenterade totalet'));
      if (!sumFrac(calcs).eq(Frac.fromJSON(q.totals.calculated.incVat))) p.push(at('summan av raderna är inte det beräknade totalet'));
    } catch (e) { p.push(at('kan inte läsas: ' + (e && e.message))); }
    return p;
  }

  /** Kontroll av en kundorder (lista med problem, tom = bra). */
  function validateOrder(o, cur) {
    const p = [], at = m => prob('bad_order', 'kundorder ' + o.id + ': ' + m, o.id);
    try {
      if (!ORDER_STATUS.includes(o.status)) p.push(at('okänd status ' + o.status));
      if (!Number.isSafeInteger(o.version) || o.version < 1) p.push(at('ogiltig version'));
      if (o.currency !== cur) p.push(at('fel valuta'));
      if (typeof o.approvedBy !== 'string' || !o.approvedBy.trim()) p.push(at('vem som godkände saknas'));
      if (!Array.isArray(o.lines) || !Array.isArray(o.fees)) return [...p, at('rader och avgifter måste vara listor')];
      const agreedIncs = [], rateLists = [], presIncs = [], calcs = [];
      for (const l of o.lines) {
        const lv = priceLevels(l);
        const ai = lv.agreedIncVat, ae = Money.fromJSON(l.agreed.unitExVat), av = Money.fromJSON(l.agreed.unitVat);
        if (!ae.add(av).eq(ai)) p.push(at('överenskommet exkl. moms + moms är inte inkl. moms (' + l.arrangementId + ')'));
        if (!sumMoney(moneyRates(l.agreed.byRate).map(g => g.incVat), cur).eq(ai)) p.push(at('momsraderna summerar inte till det överenskomna priset (' + l.arrangementId + ')'));
        if (!ai.sub(lv.presentedIncVat).eq(lv.adjustmentIncVat)) p.push(at('prisjusteringen är inte överenskommet minus presenterat (' + l.arrangementId + ')'));
        if (!ai.toFrac().sub(lv.calculatedIncVat).eq(lv.agreedVsCalculated)) p.push(at('skillnaden mot det beräknade stämmer inte (' + l.arrangementId + ')'));
        agreedIncs.push(times(ai, l.quantity)); presIncs.push(times(lv.presentedIncVat, l.quantity)); calcs.push(lv.calculatedIncVat.mul(Frac.of(BigInt(l.quantity))));
        rateLists.push(moneyRates(l.agreed.byRate).map(g => ({ rateBp: g.rateBp, exVat: times(g.exVat, l.quantity), vat: times(g.vat, l.quantity), incVat: times(g.incVat, l.quantity) })));
      }

/* Maison Studio: favoriter per florist.
 *
 * Prototypen kan inte logga in, så favoriterna sparas lokalt i webbläsaren (localStorage), en lista per florist.
