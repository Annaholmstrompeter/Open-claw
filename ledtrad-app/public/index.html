:root {
  --paper:#FFFDF9; --paper-raised:#FFFFFF; --ink:#2A2420; --ink-soft:#6B6259; --line:#EDE6DA; --line-strong:#DCD2C1;

  --marigold:#F2A11E; --marigold-ink:#7A4A00; --marigold-soft:#FFF3D9; --marigold-line:#F5D189;
  --coral:#F2604A; --coral-ink:#8A2E1F; --coral-soft:#FFE4DC; --coral-line:#F6B7A6;
  --sky:#5273D6; --sky-ink:#23386E; --sky-soft:#E6ECFC; --sky-line:#B9C7F2;
  --leaf:#2F9463; --leaf-ink:#1C5A3A; --leaf-soft:#DFF3E8; --leaf-line:#A9DDC0;
  --plum:#7C4FB0; --plum-ink:#4A2C6B; --plum-soft:#F1E7FA; --plum-line:#D3B8ED;

  --shadow-sm: 0 1px 0 rgba(42,36,32,0.06);
  --shadow-card: 0 2px 10px rgba(42,36,32,0.06);
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 10px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#181410; --paper-raised:#221C16; --ink:#F4EEE3; --ink-soft:#B7AC9B; --line:#332A20; --line-strong:#453A2C;

    --marigold:#FFC155; --marigold-ink:#FFE8BC; --marigold-soft:#3B2A0E; --marigold-line:#5C4419;
    --coral:#FF9782; --coral-ink:#FFD9CE; --coral-soft:#3A1E17; --coral-line:#5C2E22;
    --sky:#9DB2F2; --sky-ink:#DEE5FB; --sky-soft:#1B2340; --sky-line:#2E3A60;
    --leaf:#79D3A4; --leaf-ink:#D3F3E3; --leaf-soft:#12291C; --leaf-line:#1F4A30;
    --plum:#CBA6F2; --plum-ink:#EDE0FA; --plum-soft:#271A38; --plum-line:#40295C;

    --shadow-sm: 0 1px 0 rgba(0,0,0,0.3);
    --shadow-card: 0 2px 14px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --paper:#181410; --paper-raised:#221C16; --ink:#F4EEE3; --ink-soft:#B7AC9B; --line:#332A20; --line-strong:#453A2C;

  --marigold:#FFC155; --marigold-ink:#FFE8BC; --marigold-soft:#3B2A0E; --marigold-line:#5C4419;
  --coral:#FF9782; --coral-ink:#FFD9CE; --coral-soft:#3A1E17; --coral-line:#5C2E22;
  --sky:#9DB2F2; --sky-ink:#DEE5FB; --sky-soft:#1B2340; --sky-line:#2E3A60;
  --leaf:#79D3A4; --leaf-ink:#D3F3E3; --leaf-soft:#12291C; --leaf-line:#1F4A30;
  --plum:#CBA6F2; --plum-ink:#EDE0FA; --plum-soft:#271A38; --plum-line:#40295C;

  --shadow-sm: 0 1px 0 rgba(0,0,0,0.3);
  --shadow-card: 0 2px 14px rgba(0,0,0,0.35);
}

* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  background:var(--paper); color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3 { font-family:'Fredoka',system-ui,sans-serif; font-weight:600; margin:0; text-wrap:balance; }
p { margin:0; line-height:1.55; }
button { font-family:inherit; cursor:pointer; }
input,select,textarea { font-family:inherit; }
::selection { background:var(--marigold-line); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline:2px solid var(--sky); outline-offset:2px;
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

.shell { max-width:480px; margin:0 auto; padding:20px 18px 96px; min-height:100vh; position:relative; }

.eyebrow { font-family:'Manrope'; font-weight:700; font-size:0.7rem; letter-spacing:0.11em; text-transform:uppercase; color:var(--ink-soft); }
.datecap { font-size:0.85rem; color:var(--ink-soft); font-weight:600; margin:2px 0 18px; }
.mono { font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:999px;
  padding:14px 22px; font-family:'Fredoka'; font-weight:600; font-size:1rem; box-shadow:var(--shadow-sm); transition:transform .12s ease; }
.btn:active { transform:scale(0.97); }
.btn-primary { background:var(--ink); color:var(--paper); width:100%; }
.btn-ghost { background:transparent; color:var(--ink); border:1.5px solid var(--line-strong); }
.btn-block { width:100%; }
.btn-sm { padding:9px 16px; font-size:0.85rem; }

.backrow { display:flex; align-items:center; gap:10px; margin-bottom:2px; }
.iconbtn { width:38px; height:38px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--paper-raised);
  display:flex; align-items:center; justify-content:center; font-size:1.05rem; color:var(--ink); flex-shrink:0; }
.screentitle { font-size:1.35rem; }

.card { background:var(--paper-raised); border-radius:var(--radius-lg); padding:18px; box-shadow:var(--shadow-card); border:1px solid var(--line); }

.chiprow { display:flex; flex-wrap:wrap; gap:8px; }
.chip { border-radius:999px; border:1.5px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
  padding:9px 15px; font-size:0.88rem; font-weight:600; font-family:'Manrope'; white-space:nowrap; }
.chip.active { background:var(--ink); border-color:var(--ink); color:var(--paper); }
.chip.warn.active { background:var(--coral); border-color:var(--coral); color:#fff; }
.chip.addnew { border-style:dashed; }

.field-label { font-weight:700; font-size:0.92rem; margin-bottom:8px; display:block; }
.textinput, .selectinput, .textarea { width:100%; border:1.5px solid var(--line-strong); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:1rem; background:var(--paper-raised); color:var(--ink); }
.textarea { min-height:80px; resize:vertical; }
.addrow { display:flex; gap:8px; }
.addrow .textinput { flex:1; }

.stack { display:flex; flex-direction:column; gap:14px; }
.row { display:flex; align-items:center; justify-content:space-between; gap:10px; }

.journeystrip { display:flex; align-items:flex-start; }
.journeystep { display:flex; flex-direction:column; align-items:center; gap:8px; width:64px; flex-shrink:0; }
.journeydot { width:44px; height:44px; border-radius:50%; background:var(--paper-raised); border:1.5px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; font-size:1.2rem; box-shadow:var(--shadow-sm); }
.journeylabel { font-size:0.68rem; font-weight:700; color:var(--ink-soft); text-align:center; line-height:1.25; }
.journeyline { flex:1; height:1.5px; background:var(--line-strong); margin-top:22px; }

/* onboarding */
.ob-progress { display:flex; gap:6px; margin-bottom:20px; }

  if(h<10) return "frukost"; if(h<14) return "lunch"; if(h<17) return "mellanmal"; if(h<21) return "middag"; return "mellanmal"; }
function dateTimeToISO(dateStr, timeStr){
  if(!timeStr) timeStr = "12:00";
  var d = new Date(dateStr+"T"+timeStr+":00");
  return d.toISOString();
}
function isoToClock(iso){
  var d = new Date(iso);
  return pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function offsetLabel(min){ return min>=60 ? (min/60)+" tim" : min+" min"; }
function splitItemInput(raw){
  return raw.split(",").map(function(s){return s.trim();}).filter(Boolean);
}
function addItemsToDraftMeal(raw){
  var added = [];
  splitItemInput(raw).forEach(function(v){
    if(!draft.meal.items.some(function(it){return it.toLowerCase()===v.toLowerCase();})){
      draft.meal.items.push(v); added.push(v);
    }
  });
  return added;
}

function defaultState(){
  return {
    onboarding:{done:false, goals:[], symptoms:[]},
    trialStartedAt:null,
    plan:"trial",
    days:{},
    customPresets:[],
    activeTrackers:[],
    customTrackerLabels:[],
    lastMorningPromptDate:null,
    activeDiet:null,
    dietHistory:[],
    protocol:{
      phase:0, safetyAckAt:null, baselineStartDate:null,
      elimination:null, eliminationHistory:[],
      testing:null, itemStatuses:{}, celebrated:[]
    },
    screen:"welcome"
  };
}
function trackerDef(key){
  if(key.indexOf("custom:")===0) return {key:key, label:key.slice(7), icon:"📈"};
  return TRACKER_CATALOG.filter(function(t){return t.key===key;})[0] || {key:key, label:key, icon:"📈"};
}
function defaultTrackersFromSymptoms(symptoms){
  var set = [];
  (symptoms||[]).forEach(function(s){
    (TRACKER_DEFAULTS_BY_SYMPTOM[s]||[]).forEach(function(t){ if(set.indexOf(t)<0) set.push(t); });
  });
  if(set.length===0) set = ["energi","lugn"];
  return set.slice(0,4);
}

function migrateDay(day){
  if(!day.checkins) day.checkins = [];
  if(!day.trackerLogs) day.trackerLogs = [];
  if(day.sleep===undefined) day.sleep = null;
  if(day.symptoms){
    day.symptoms.forEach(function(s){
      day.checkins.push({id:s.id||uid(), time:s.time||nowTime(), moods:[], tags:s.tags||[], severity:s.severity||null,
        note:s.note||"", linkedMealId:null, offsetMin:null});
    });
    delete day.symptoms;
  }
  if(day.mood){
    day.checkins.unshift({id:uid(), time:nowTime(), moods:[day.mood], tags:[], severity:null, note:"", linkedMealId:null, offsetMin:null});
    delete day.mood;
  }
  (day.meals||[]).forEach(function(m){
    if(!m.items){ m.items = m.content ? m.content.split(",").map(function(s){return s.trim();}).filter(Boolean) : []; delete m.content; }
    if(!m.followups) m.followups = [];
  });
  return day;
}

function load(){
  try{
    var raw=localStorage.getItem(STORAGE_KEY);
    var s = raw ? JSON.parse(raw) : null;
    if(!s){
      var oldRaw = localStorage.getItem("ledtrad-v1");
      if(oldRaw) s = JSON.parse(oldRaw);
    }
    if(!s) return defaultState();
    s = Object.assign(defaultState(), s);
    Object.keys(s.days||{}).forEach(function(d){ s.days[d] = migrateDay(s.days[d]); });
    if(!s.customPresets) s.customPresets = [];
    if(!s.activeTrackers) s.activeTrackers = [];
    if(!s.customTrackerLabels) s.customTrackerLabels = [];
    if(s.lastMorningPromptDate===undefined) s.lastMorningPromptDate = null;
    if(s.activeDiet===undefined) s.activeDiet = null;
    if(!s.dietHistory) s.dietHistory = [];
    if(!s.protocol) s.protocol = {phase:0, safetyAckAt:null, baselineStartDate:null, elimination:null, eliminationHistory:[], testing:null, itemStatuses:{}, celebrated:[]};
    if(!s.protocol.itemStatuses) s.protocol.itemStatuses = {};
    if(!s.protocol.eliminationHistory) s.protocol.eliminationHistory = [];
    if(!s.protocol.celebrated) s.protocol.celebrated = [];
    return s;
  }catch(e){ return defaultState(); }
}
var state = load();
function persist(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function getDay(dateStr){ if(!state.days[dateStr]) state.days[dateStr]={checkins:[],meals:[],trackerLogs:[],sleep:null}; return state.days[dateStr]; }
function dayHasActivity(e){ return e.meals.length>0 || e.checkins.length>0 || (e.trackerLogs&&e.trackerLogs.length>0) || e.sleep; }

var draft = { meal:null, checkin:null, followup:null, sleep:null, celebration:null };

function toast(msg, ms){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, ms||1800);
}

function trialDaysLeft(){
  if(!state.trialStartedAt) return 30;
  return Math.max(0, 30 - daysBetween(state.trialStartedAt, todayStr()));
}

function computeStreak(){
  var cursor = state.days[todayStr()] ? todayStr() : addDays(todayStr(),-1);
  var n=0;
  while(state.days[cursor] && dayHasActivity(state.days[cursor])){
    n++; cursor=addDays(cursor,-1);
  }
  return n;
}
function totalDaysLogged(){ return Object.keys(state.days).filter(function(d){ return dayHasActivity(state.days[d]); }).length; }

function allPresets(type){
  var base = MEAL_PRESETS[type] || [];
  var custom = (state.customPresets||[]).filter(function(c){
    return !base.some(function(b){ return b.toLowerCase()===c.toLowerCase(); });
  });
  return base.concat(custom);
}
function learnPresets(items){
  items.forEach(function(item){
    var low = item.toLowerCase();
    var known = (state.customPresets||[]).concat(Object.keys(MEAL_PRESETS).reduce(function(acc,k){return acc.concat(MEAL_PRESETS[k]);},[]))
      .some(function(p){ return p.toLowerCase()===low; });
    if(!known) state.customPresets.push(item);
  });
}

function matchTriggers(items){
  var out=[];
  items.forEach(function(item){
    var low=item.toLowerCase(); var matched=null;
    TRIGGER_CATEGORIES.forEach(function(cat){
      if(!matched && cat.match.some(function(m){ return low.indexOf(m)>-1; })) matched=cat.key;
    });
    var tag = matched || low;
    if(out.indexOf(tag)<0) out.push(tag);
  });
  return out;
}

function computeInsights(){
  var counts={}, totals={};
  Object.keys(state.days).forEach(function(dateStr){
    var day=state.days[dateStr];
    var allMealItems=[];
    day.meals.forEach(function(m){ allMealItems = allMealItems.concat(m.items||[]); });
    day.checkins.forEach(function(ci){
      if(ci.tags.length===0) return;
      var items;
      if(ci.linkedMealId){
        var m = day.meals.filter(function(x){return x.id===ci.linkedMealId;})[0];
        items = m ? (m.items||[]) : [];
      } else {
        items = allMealItems;
      }
      var tags = matchTriggers(items);
      ci.tags.forEach(function(symptom){
        totals[symptom]=(totals[symptom]||0)+1;
        tags.forEach(function(trig){ var key=symptom+"|"+trig; counts[key]=(counts[key]||0)+1; });
      });
    });
  });
  var rows=[];
  Object.keys(counts).forEach(function(key){
    var parts=key.split("|"); var symptom=parts[0], trig=parts[1];
    var c=counts[key], t=totals[symptom]||1;
    if(c>=2 && (c/t)>=0.5) rows.push({symptom:symptom, trig:trig, count:c, total:t, ratio:c/t});
  });
  rows.sort(function(a,b){ return (b.ratio-a.ratio) || (b.count-a.count); });
  return rows.slice(0,6);
}

function trackerSeries(key){
  var perDay = {};
  Object.keys(state.days).sort().forEach(function(dateStr){
    var logs = (state.days[dateStr].trackerLogs||[]).filter(function(l){return l.key===key;});
    if(logs.length===0) return;
    var sum=0; logs.forEach(function(l){sum+=l.value;});
    perDay[dateStr] = sum/logs.length;
  });
  return Object.keys(perDay).map(function(d){ return {date:d, value:perDay[d]}; });
}
function renderTrackerChart(key){
  var series = trackerSeries(key);
  var def = trackerDef(key);
  if(series.length<3){
    return '<div class="empty" style="padding:16px;"><span class="eicon">📈</span>'+escapeHtml(def.label)+' visas som kurva när du loggat minst 3 olika dagar (har '+series.length+' än så länge).</div>';
  }
  var w=280, h=90, padL=8, padR=8, padT=10, padB=10;
  var n=series.length;
  var stepX = n>1 ? (w-padL-padR)/(n-1) : 0;
  function yFor(v){ return padT + (5-v)/4*(h-padT-padB); }
  var pts = series.map(function(pt,i){ return [padL+i*stepX, yFor(pt.value)]; });
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var last = pts[pts.length-1];
  var gridLines = [1,2,3,4,5].map(function(v){ var y=yFor(v).toFixed(1);
    return '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'; }).join("");
  return '<div style="margin-bottom:6px;"><span style="font-weight:700;font-size:0.88rem;">'+def.icon+' '+escapeHtml(def.label)+'</span></div>' +
    '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">' + gridLines +
    '<path d="'+pathD+'" fill="none" stroke="var(--sky)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4" fill="var(--sky)"/>' +
    '</svg>';
}

var INSIGHT_MIN_DAYS = 3;
function insightReadyDayCount(){
  return Object.keys(state.days).filter(function(d){
    return state.days[d].checkins.some(function(ci){ return ci.tags.length>0; });
  }).length;
}
function insightsIfReady(){
  return insightReadyDayCount()>=INSIGHT_MIN_DAYS ? computeInsights() : [];
}

function baselineQualifyingDays(){
  if(!state.protocol.baselineStartDate) return 0;
  return Object.keys(state.days).filter(function(d){
    return d >= state.protocol.baselineStartDate && dayHasActivity(state.days[d]);
  }).length;
}
function setItemStatus(item, status, note){
  var key = item.toLowerCase();
  var prev = state.protocol.itemStatuses[key];
  var finalStatus = (status==="possible" && prev && prev.status==="possible") ? "repeated" : status;
  state.protocol.itemStatuses[key] = {status:finalStatus, note:note||"", lastDate:todayStr(), label:item};
}
function itemStatusList(){
  return Object.keys(state.protocol.itemStatuses).map(function(k){ return state.protocol.itemStatuses[k]; })
    .sort(function(a,b){ return b.lastDate.localeCompare(a.lastDate); });
}
var PROTOCOL_PHASE_NAMES = {1:"Baslinje", 2:"Eliminering", 3:"Trygg meny", 4:"Återintroduktion"};

function protocolHeroCard(){
  var p = state.protocol;
  var html = '<button class="herocard" data-action="nav:protocol">' +
    '<div class="eyebrow">🧪 NOLLSTÄLLNINGSPROTOKOLL</div>';

  if(p.phase===0){
    html += '<div class="herotitle">Starta din nollställning</div>' +
      '<p class="herotext">En skonsam process, steg för steg, för att hitta vad som faktiskt triggar dig. Ingen diagnos — din egen uppmätta sanning.</p>' +
      '<span class="btn btn-primary btn-block">Kom igång →</span>';
  } else {
    var sub = "";
    if(p.phase===1){
      var days = baselineQualifyingDays();
      var pct = Math.min(100, Math.round(100*days/3));
      html += '<div class="herotitle">Fas 1 · Baslinje</div>' +
        '<div class="herobar"><div style="width:'+pct+'%;"></div></div>' +
        '<p class="herotext">'+Math.max(1,days)+' av minst 3 dagar loggade. Ät och må som vanligt tills nästa steg låses upp.</p>';
    } else if(p.phase===2){
      sub = p.elimination ? "Dag "+(daysBetween(p.elimination.startDate,todayStr())+1)+" utan "+escapeHtml(p.elimination.custom?p.elimination.target:dietDef(p.elimination.target).label)
        : "Dags att välja vad som ska bort — en sak i taget.";
      html += '<div class="herotitle">Fas 2 · Eliminering</div><p class="herotext">'+sub+'</p>';
    } else if(p.phase===3){
      html += '<div class="herotitle">Fas 3 · Trygg meny</div><p class="herotext">Redo att testa tillbaka när du känner dig stabil.</p>';
    } else if(p.phase===4){
      sub = p.testing ? "Testar just nu: "+escapeHtml(p.testing.item) : "Välj nästa sak att testa tillbaka.";
      html += '<div class="herotitle">Fas 4 · Återintroduktion</div><p class="herotext">'+sub+'</p>';
    }
    html += '<span class="btn btn-primary btn-block">Fortsätt →</span>';
  }
  html += '</button>';
  return html;
}
function checkMilestones(){
  var newOnes = [];
  MILESTONES.forEach(function(m){
    if(state.protocol.celebrated.indexOf(m.key)<0 && m.test()){
      state.protocol.celebrated.push(m.key);
      newOnes.push(m);
    }
  });
  if(newOnes.length>0){ persist(); draft.celebration = newOnes[0]; }
}

function planFocusList(){
  var freq={};
  (state.onboarding.symptoms||[]).forEach(function(sym){
    (SYMPTOM_FOCUS[sym]||[]).forEach(function(f){ freq[f]=(freq[f]||0)+1; });
  });
  var list=Object.keys(freq).sort(function(a,b){ return freq[b]-freq[a]; });
  return list.slice(0,5);
}

function getDueFollowups(){
  var now = new Date().toISOString();
  var nowMs = Date.now();
  var out = [];
  Object.keys(state.days).forEach(function(dateStr){
    state.days[dateStr].meals.forEach(function(m){
      (m.followups||[]).forEach(function(f){
        if(f.done || f.dueAt>now) return;
        if(nowMs - new Date(f.dueAt).getTime() > FOLLOWUP_EXPIRY_MS) return;
        out.push({dateStr:dateStr, meal:m, followup:f});
      });
    });
  });
  out.sort(function(a,b){ return a.followup.dueAt.localeCompare(b.followup.dueAt); });
  return out;
}

function moodText(ci){
  var labels = (ci.moods||[]).map(function(k){ var m=MOODS.filter(function(x){return x.key===k;})[0]; return m?m.glyph+" "+m.label:k; });
  return labels.join(" · ");
}

function renderTodayTimeline(day){
  var items=[];
  day.meals.forEach(function(m){ items.push({time:m.time||"—", sort:m.time||"99:99", icon:MEAL_TYPES.filter(function(t){return t.key===m.type;})[0].icon, bg:"var(--marigold-soft)",
    text:(MEAL_TYPES.filter(function(t){return t.key===m.type;})[0]||{}).label + (m.items&&m.items.length?": "+m.items.join(", "):""),
    meta:null, kind:"meal", id:m.id}); });
  day.checkins.forEach(function(ci){
    var moodTxt = moodText(ci);
    var tagTxt = ci.tags.length ? ci.tags.join(", ") : "";
    var text = [moodTxt, tagTxt].filter(Boolean).join(" — ") || "Incheckning";
    var meta = [];
    if(ci.severity) meta.push((SEVERITIES.filter(function(x){return x.key===ci.severity;})[0]||{}).label);
    if(ci.offsetMin) meta.push("uppföljning +"+offsetLabel(ci.offsetMin));
    items.push({time:ci.time||"—", sort:ci.time||"99:99", icon:"💗", bg:"var(--coral-soft)",
      text:text, meta:meta.join(" · ")||null, kind:"checkin", id:ci.id});
  });
  (day.trackerLogs||[]).forEach(function(l){
    var def = trackerDef(l.key);
    items.push({time:l.time||"—", sort:l.time||"99:99", icon:def.icon, bg:"var(--plum-soft)",
      text:def.label+": "+l.value+"/5", meta:null, kind:"tracker", id:l.id});
  });
  if(day.wakeTapTime){
    items.push({time:day.wakeTapTime, sort:"00:01", icon:"🌅", bg:"var(--marigold-soft)",
      text:"Godmorgon tryckt kl "+day.wakeTapTime, meta:null, kind:"wake", id:"wake"});
  }
  if(day.sleep){
    var sl = day.sleep;
    var sparts = [];
    if(sl.hours) sparts.push(sl.hours+" tim");
    if(sl.quality) sparts.push("kvalitet "+sl.quality+"/5");
    items.push({time:sl.time||"—", sort:"00:00", icon:"😴", bg:"var(--leaf-soft)",
      text:"Sömn: "+(sparts.join(", ")||"loggad"), meta:null, kind:"sleep", id:"sleep"});
  }
  items.sort(function(a,b){ return a.sort.localeCompare(b.sort); });
  if(items.length===0){
    return '<div class="empty"><span class="eicon">🌾</span>Inget loggat än idag.<br>Börja med en måltid eller hur du mår.</div>';
  }
  var html='<div class="timeline">';
  items.forEach(function(it){
    html += '<div class="tlitem"><div class="tlicon" style="background:'+it.bg+'">'+it.icon+'</div>' +
      '<div class="tlbody"><div class="tltime mono">'+escapeHtml(it.time)+'</div>' +
      '<div class="tltext">'+escapeHtml(it.text)+'</div>' +
      (it.meta?'<div class="tlmeta">'+escapeHtml(it.meta)+'</div>':'') + '</div>' +
      '<div class="tlactions">' +
      (it.kind==="meal" ? '<button class="tlbtn" data-action="copy-reminder" data-id="'+it.id+'" aria-label="Kopiera påminnelsetider">🔔</button>' : '') +
      (it.kind==="meal" ? '<button class="tlbtn" data-action="edit-meal" data-id="'+it.id+'" aria-label="Ändra">✏️</button>' : '') +
      (it.kind==="sleep" ? '<button class="tlbtn" data-action="nav:sleep" aria-label="Ändra">✏️</button>' : '') +
      (it.kind==="checkin"||it.kind==="tracker" ? '<button class="tlbtn" data-action="delete-'+it.kind+'" data-id="'+it.id+'" aria-label="Ta bort">×</button>' : '') +
      '</div></div>';
  });
  html += '</div>';
  return html;
}

/* ---------- render + wiring ---------- */

function render(){
  var app = document.getElementById("app");
  var s = state.screen;
  var html = "";
  if(s==="welcome") html = screenWelcome();
  else if(s==="goals") html = screenGoals();
  else if(s==="symptoms") html = screenSymptoms();
  else if(s==="plan") html = screenPlan();
  else if(s==="home") html = screenHome();
  else if(s==="log-meal") html = screenLogMeal();
  else if(s==="log-checkin") html = screenLogCheckin();
  else if(s==="trackers") html = screenTrackers();
  else if(s==="sleep") html = screenSleep();
  else if(s==="protocol") html = screenProtocol();
  else if(s==="followup") html = screenFollowup();
  else if(s==="insights") html = screenInsights();
  else if(s==="plan-view") html = screenPlanView();
  else if(s==="settings") html = screenSettings();
  else if(s==="paywall") html = screenPaywall();
  else html = screenHome();
  if(draft.celebration) html += renderCelebrationOverlay(draft.celebration);
  app.innerHTML = html;
}

document.getElementById("app").addEventListener("keydown", function(e){
  if(e.key==="Enter" && e.target && e.target.id==="mealCustomItem"){
    e.preventDefault();
    if(e.target.value.trim() && draft.meal){
      addItemsToDraftMeal(e.target.value);
      e.target.value="";
      render();
    }
  }
});

document.getElementById("app").addEventListener("click", function(e){
  var el = e.target.closest("[data-action]");
  if(!el) return;
  var action = el.getAttribute("data-action");
  var key = el.getAttribute("data-key");
  var id = el.getAttribute("data-id");

  if(action.indexOf("nav:")===0){ nav(action.slice(4)); return; }

  if(action==="toggle-goal"){
    var i = state.onboarding.goals.indexOf(key);
    if(i>-1) state.onboarding.goals.splice(i,1); else state.onboarding.goals.push(key);
    persist(); render(); return;
  }
  if(action==="toggle-symptom"){
    var i2 = state.onboarding.symptoms.indexOf(key);
    if(i2>-1) state.onboarding.symptoms.splice(i2,1); else state.onboarding.symptoms.push(key);
    persist(); render(); return;
  }
  if(action==="skip-symptoms"){ e.preventDefault(); nav("plan"); return; }
  if(action==="finish-onboarding"){
    state.onboarding.done = true;
    if(!state.trialStartedAt) state.trialStartedAt = todayStr();
    if(state.activeTrackers.length===0) state.activeTrackers = defaultTrackersFromSymptoms(state.onboarding.symptoms);
    persist(); nav("home"); toast("Välkommen! 🌱"); return;
  }
  if(action==="edit-plan"){ nav("symptoms"); return; }

  if(action==="new-meal"){
    draft.meal = {type: suggestedMealType(), items: [], time: nowTime(), editingId:null};
    nav("log-meal"); return;
  }
  if(action==="new-checkin"){
    draft.checkin = {moods:[], tags:[], severity:null};
    nav("log-checkin"); return;
  }
  if(action==="celebration-dismiss"){
    draft.celebration = null;
    render(); return;
  }
  if(action==="morning-dismiss"){
    state.lastMorningPromptDate = todayStr();
    persist(); render(); return;
  }
  if(action==="morning-tap"){
    state.lastMorningPromptDate = todayStr();
    var dayM = getDay(todayStr());
    dayM.wakeTapTime = nowTime();
    draft.checkin = {moods:[], tags:[], severity:null};
    persist(); nav("log-checkin"); toast("Godmorgon-tid sparad: "+dayM.wakeTapTime); return;
  }
  if(action==="edit-meal"){
    var day5 = getDay(todayStr());
    var m5 = day5.meals.filter(function(x){return x.id===id;})[0];
    if(!m5) return;
    draft.meal = {type:m5.type, items:m5.items.slice(), time:m5.time, editingId:m5.id};
    nav("log-meal"); return;
  }
  if(action==="set-meal-type"){ draft.meal.type = key; render(); return; }
  if(action==="toggle-preset-item"){
    var idx = draft.meal.items.findIndex(function(it){return it.toLowerCase()===key.toLowerCase();});
    if(idx>-1) draft.meal.items.splice(idx,1); else draft.meal.items.push(key);
    render(); return;
  }
  if(action==="remove-item"){
    draft.meal.items = draft.meal.items.filter(function(it){ return it.toLowerCase()!==key.toLowerCase(); });
    render(); return;
  }
  if(action==="add-custom-item"){
    var input = document.getElementById("mealCustomItem");
    if(!input.value.trim()) return;
    addItemsToDraftMeal(input.value);
    input.value="";
    render(); return;
  }
  if(action==="save-meal"){
    var time = document.getElementById("mealTime").value || nowTime();
    var customInput = document.getElementById("mealCustomItem");
    if(customInput && customInput.value.trim()) addItemsToDraftMeal(customInput.value);
    if(draft.meal.items.length===0){ toast("Lägg till minst något"); return; }
    learnPresets(draft.meal.items);
    var day6 = getDay(todayStr());
    if(draft.meal.editingId){
      var existing = day6.meals.filter(function(x){return x.id===draft.meal.editingId;})[0];
      if(existing){ existing.type=draft.meal.type; existing.items=draft.meal.items.slice(); existing.time=time; }
      draft.meal = null; persist(); nav("home"); toast("Måltid uppdaterad ✓"); return;
    }
    var mealId = uid();
    var followups = FOLLOWUP_OFFSETS.map(function(min){
      return {id:uid(), offsetMin:min, dueAt:addMinutesISO(todayStr(), time, min), done:false, result:null};
    });
    day6.meals.push({id:mealId, type:draft.meal.type, time:time, items:draft.meal.items.slice(), followups:followups});
    followups.forEach(function(f){ scheduleServerPush(f, draft.meal.type, draft.meal.items); });
    draft.meal = null;
    checkMilestones(); persist(); nav("home");
    var followupTimes = followups.map(function(f){ return isoToClock(f.dueAt); }).join(" och ");
    toast("Måltid sparad ✓ Uppföljning kl "+followupTimes, 3400);
    return;
  }
  if(action==="copy-reminder"){
    var dayR = getDay(todayStr());
    var mealR = dayR.meals.filter(function(x){return x.id===id;})[0];
    if(!mealR){ return; }
    var times = (mealR.followups||[]).map(function(f){ return isoToClock(f.dueAt); });
    var label = (MEAL_TYPES.filter(function(t){return t.key===mealR.type;})[0]||{}).label || mealR.type;
    var txt = "Ledtråd – checka in efter " + label.toLowerCase() + ": " + times.join(" och ");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast("Tider kopierade – klistra in i din larm-app"); })
        .catch(function(){ toast("Kunde inte kopiera"); });
    } else { toast("Kopiering stöds inte här"); }
    return;
  }
  if(action==="delete-meal"){
    var day2 = getDay(todayStr());
    var mealToDelete = day2.meals.filter(function(m){return m.id===id;})[0];
    if(mealToDelete) (mealToDelete.followups||[]).forEach(function(f){ if(!f.done) unscheduleServerPush(f.id); });
    day2.meals = day2.meals.filter(function(m){ return m.id!==id; });
    persist(); render(); return;
  }

  if(action==="toggle-mood"){
    var im = draft.checkin.moods.indexOf(key);
    if(im>-1) draft.checkin.moods.splice(im,1); else draft.checkin.moods.push(key);
    render(); return;
  }
  if(action==="toggle-symptom-tag"){
    var i4 = draft.checkin.tags.indexOf(key);
    if(i4>-1) draft.checkin.tags.splice(i4,1); else draft.checkin.tags.push(key);
    if(draft.checkin.tags.length===0) draft.checkin.severity=null;
    render(); return;
  }
  if(action==="save-checkin"){
    var note = document.getElementById("checkinNote").value.trim();
    var d2 = draft.checkin;
    if(d2.moods.length===0 && d2.tags.length===0){ toast("Välj mående eller ett symtom"); return; }
    var day3 = getDay(todayStr());
    day3.checkins.push({id:uid(), time:nowTime(), moods:d2.moods.slice(), tags:d2.tags.slice(), severity:d2.severity, note:note,
      linkedMealId:null, offsetMin:null});
    draft.checkin = null;
    checkMilestones(); persist(); nav("home"); toast("Sparat ✓"); return;
  }
  if(action==="delete-checkin"){
    var day4 = getDay(todayStr());
    day4.checkins = day4.checkins.filter(function(c){ return c.id!==id; });
    persist(); render(); return;
  }

  if(action==="log-tracker"){
    var val = parseInt(el.getAttribute("data-value"),10);
    var day7 = getDay(todayStr());
    day7.trackerLogs.push({id:uid(), key:key, value:val, time:nowTime()});
    checkMilestones(); persist(); render(); toast(trackerDef(key).label+": "+val+"/5 sparat ✓"); return;
  }
  if(action==="delete-tracker"){
    var day8 = getDay(todayStr());
    day8.trackerLogs = day8.trackerLogs.filter(function(l){ return l.id!==id; });
    persist(); render(); return;
  }
  if(action==="toggle-tracker"){
    var ti = state.activeTrackers.indexOf(key);
    if(ti>-1) state.activeTrackers.splice(ti,1); else state.activeTrackers.push(key);
    persist(); render(); return;
  }
  if(action==="add-custom-tracker"){
    var tinput = document.getElementById("customTrackerName");
    var tval = tinput.value.trim();
    if(!tval) return;
    if(state.customTrackerLabels.indexOf(tval)<0) state.customTrackerLabels.push(tval);
    var ckey = "custom:"+tval;
    if(state.activeTrackers.indexOf(ckey)<0) state.activeTrackers.push(ckey);
    tinput.value="";
    persist(); render(); return;
  }
  if(action==="set-sleep-quality"){
    var hEl = document.getElementById("sleepHours");
    if(hEl) draft.sleep.hours = hEl.value;
    draft.sleep.quality = parseInt(el.getAttribute("data-value"),10);
    render(); return;
  }
  if(action==="save-sleep"){
    var hoursVal = document.getElementById("sleepHours").value;
    var day9 = getDay(todayStr());
    day9.sleep = {hours: hoursVal?parseFloat(hoursVal):null, quality: draft.sleep.quality, time: nowTime()};
    draft.sleep = null;
    checkMilestones(); persist(); nav("home"); toast("Sömn sparad ✓"); return;
  }

  if(action==="open-followup"){
    openFollowup({dateStr:el.getAttribute("data-date"), meal:{id:el.getAttribute("data-mealid")}, followup:{id:el.getAttribute("data-fid")}});
    return;
  }
  if(action==="toggle-followup-tag"){
    var ift = draft.followup.tags.indexOf(key);
    if(ift>-1) draft.followup.tags.splice(ift,1); else draft.followup.tags.push(key);
    draft.followup.none=false;
    render(); return;
  }
  if(action==="toggle-followup-none"){
    draft.followup.none = !draft.followup.none;
    if(draft.followup.none){ draft.followup.tags=[]; draft.followup.severity=null; }
    render(); return;
  }
  if(action==="save-followup"){ commitFollowup(false); return; }
  if(action==="skip-followup"){ e.preventDefault(); commitFollowup(true); return; }

  if(action==="protocol-safety-ack"){
    state.protocol.safetyAckAt = todayStr();
    state.protocol.phase = 1;
    state.protocol.baselineStartDate = todayStr();
    persist(); render(); toast("Baslinjen har börjat 🌱"); return;
  }
  if(action==="protocol-to-elimination"){
    checkMilestones();
    state.protocol.phase = 2;
    persist(); render(); return;
  }
  if(action==="start-elimination"){
    state.protocol.elimination = {target:key, custom:false, startDate:todayStr()};
    persist(); render(); toast(dietDef(key).label+" borttaget 🧪"); return;
  }
  if(action==="start-elimination-custom"){
    var elInput = document.getElementById("customElimination");
    var elVal = elInput.value.trim();
    if(!elVal) return;
    state.protocol.elimination = {target:elVal, custom:true, startDate:todayStr()};
    persist(); render(); toast(elVal+" borttaget 🧪"); return;
  }
  if(action==="end-elimination"){
    var elim = state.protocol.elimination;
    if(elim){
      state.protocol.eliminationHistory.push({target:elim.target, custom:elim.custom, startDate:elim.startDate, endDate:todayStr()});
      state.protocol.elimination = null;
    }
    persist(); render(); return;
  }
  if(action==="protocol-to-safemenu"){
    checkMilestones();
    state.protocol.phase = 3;
    persist(); render(); return;
  }
  if(action==="protocol-to-testing"){
    state.protocol.phase = 4;
    persist(); render(); return;
  }
  if(action==="start-testing"){
    var tiInput = document.getElementById("testingItem");
    var tiVal = tiInput.value.trim();
    if(!tiVal) return;
    state.protocol.testing = {item:tiVal, startDate:todayStr(), dueAt:addMinutesISO(todayStr(), nowTime(), 72*60)};
    persist(); render(); toast("Test startat — vänta minst 72 tim innan nästa"); return;
  }
  if(action==="testing-result"){
    var t = state.protocol.testing;
    if(t){
      setItemStatus(t.item, key==="reacted" ? "possible" : "tolerated");
      state.protocol.testing = null;
      checkMilestones();
    }
    persist(); render();
    toast(key==="reacted" ? "Noterat — vila i bas-zonen 48–72 tim innan nästa test" : "Bra! Tillagt i din trygga lista ✓");
    return;
  }

  if(action==="enable-notifications"){ enableNotifications().then(function(){ render(); }); return; }
  if(action==="test-notification"){ testNotification(); return; }

  if(action==="export-report"){ exportReport(); return; }
  if(action==="reset-all"){
    if(window.confirm("Rensa all data och börja om? Går inte att ångra.")){
      state = defaultState(); persist(); nav("welcome");
    }
    return;
  }
  if(action==="activate-premium"){
    state.plan="premium"; persist(); nav("settings"); toast("Premium aktiverat ✨"); return;
  }
});

function addMinutesISO(dateStr, timeStr, minutes){
  var d = new Date(dateStr+"T"+timeStr+":00");
  d.setMinutes(d.getMinutes()+minutes);
  return d.toISOString();
}

function openFollowup(item){
  draft.followup = {dateStr:item.dateStr, mealId:item.meal.id, followupId:item.followup.id, tags:[], severity:null, none:false};
  nav("followup");
}

function commitFollowup(skipped){
  var d = draft.followup;
  var day = state.days[d.dateStr];
  var meal = day ? day.meals.filter(function(m){return m.id===d.mealId;})[0] : null;
  var fu = meal ? (meal.followups||[]).filter(function(f){return f.id===d.followupId;})[0] : null;
  if(fu){
    unscheduleServerPush(fu.id);
    fu.done = true;
    if(!skipped && (d.tags.length>0 || d.none)){
      fu.result = {tags:d.tags.slice(), severity:d.severity, note:""};
      day.checkins.push({id:uid(), time:nowTime(), moods:[], tags:d.tags.slice(), severity:d.severity, note:"",
        linkedMealId:d.mealId, offsetMin:fu.offsetMin});
    }
  }
  draft.followup = null;
  persist(); nav("home");
  toast(skipped ? "Uppföljning överhoppad" : "Incheckning sparad ✓");
}

/* audio + polling for follow-up reminders */
var audioCtx = null;
function unlockAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
document.addEventListener("click", unlockAudio, {once:true});
function playChime(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var t0 = audioCtx.currentTime;
    [880,1320].forEach(function(freq, i){
      var osc = audioCtx.createOscillator(); var gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t0+i*0.16);
      gain.gain.exponentialRampToValueAtTime(0.22, t0+i*0.16+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0+i*0.16+0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t0+i*0.16); osc.stop(t0+i*0.16+0.3);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([120,60,120]); }catch(e){}
}
var seenDue = {};
function checkFollowupsTick(){
  var due = getDueFollowups();
  if(due.length===0) return;
  var top = due[0];
  if(!seenDue[top.followup.id]){
    seenDue[top.followup.id] = true;
    playChime();
    if(state.screen==="home") render();
  }
}
setInterval(checkFollowupsTick, 20000);

function buildReportText(){
  var lines = [];
  lines.push("LEDTRÅD — VÅRDRAPPORT");
  lines.push("Genererad " + todayStr());
  lines.push("");
  var focus = planFocusList();
  if(focus.length>0){ lines.push("Fokusområden: " + focus.join(", ")); lines.push(""); }
  lines.push("Nollställningsprotokoll: Fas " + state.protocol.phase);
  if(state.protocol.elimination){
    var dd2 = state.protocol.elimination.custom ? state.protocol.elimination.target : dietDef(state.protocol.elimination.target).label;
    lines.push("Eliminerar just nu: " + dd2 + " (sedan " + state.protocol.elimination.startDate + ")");
  }
  var statusList = itemStatusList();
  if(statusList.length>0){
    lines.push("Testresultat:");
    statusList.forEach(function(it){ lines.push("- " + it.label + ": " + (ITEM_STATUSES[it.status]||{label:it.status}).label + " (" + it.lastDate + ")"); });
  }
  lines.push("");
  var insights = insightsIfReady();
  if(insights.length>0){
    lines.push("MÖNSTER I LOGGEN (ej diagnos):");
    insights.forEach(function(row){
      lines.push("- " + cap(row.trig) + " förekom vid " + row.count + " av " + row.total + " tillfällen med " + row.symptom.toLowerCase());
    });
    lines.push("");
  }
  var dates = Object.keys(state.days).sort().reverse();
  dates.forEach(function(dateStr){
    var day = state.days[dateStr];
    if(!dayHasActivity(day)) return;
    lines.push("## " + dateStr + " (" + formatDateLong(dateStr) + ")");
    if(day.sleep){
      var slp = [];
      if(day.sleep.hours) slp.push(day.sleep.hours+" tim");
      if(day.sleep.quality) slp.push("kvalitet "+day.sleep.quality+"/5");
      lines.push("Sömn: " + (slp.join(", ")||"loggad"));
    }
    (day.trackerLogs||[]).forEach(function(l){
      lines.push((l.time?l.time+" ":"") + trackerDef(l.key).label + ": " + l.value + "/5");
    });
    day.meals.forEach(function(m){
      var label = (MEAL_TYPES.filter(function(t){return t.key===m.type;})[0]||{}).label || m.type;
      lines.push((m.time?m.time+" ":"") + label + (m.items.length?": "+m.items.join(", "):""));
    });
    day.checkins.forEach(function(ci){
      var sev = ci.severity ? " [" + (SEVERITIES.filter(function(x){return x.key===ci.severity;})[0]||{}).label + "]" : "";
      var linked = ci.offsetMin ? " (uppföljning +"+offsetLabel(ci.offsetMin)+")" : "";
      var parts = [];
      if(ci.moods.length) parts.push("Mående: "+ci.moods.join(", "));
      if(ci.tags.length) parts.push("Symtom: "+ci.tags.join(", ")+sev);
      lines.push((ci.time?ci.time+" ":"") + parts.join(" · ") + linked + (ci.note?" — "+ci.note:""));
    });
    lines.push("");
  });
  lines.push("Detta är en sammanställning av egenrapporterad data, inte en medicinsk bedömning.");
  return lines.join("\n");
}

function exportReport(){
  var text = buildReportText();
  var blob = new Blob([text], {type:"text/plain;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "ledtrad-vardrapport.txt";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  toast("Rapport nedladdad ✓");
}

if(state.onboarding.done) state.screen = "home";
if(state.screen==="log-checkin" && !draft.checkin) draft.checkin = {moods:[], tags:[], severity:null};
render();
checkFollowupsTick();
})();
</script>
