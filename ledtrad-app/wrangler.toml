name = "ledtrad"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "LEDTRAD_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
